# zh-CN 翻译文件。
#
# 命名遵循 go-i18n 约定：translate.<lang>.toml 是「待翻译/已翻译」状态文件，
# 由 goi18n merge 从 active.en-US.toml 生成 stub 后人工补译。
#
# 当前手工维护首期 err.shared.* 翻译；后续 AST extractor 流程接入后，
# 新增 code 在 active.en-US.toml 出现，merge 会自动加 stub 到本文件。
#
# 与 pkg/i18n/codes/shared.go 的 DefaultMessages["zh-CN"] 内容一致——
# TOML 是日常运行路径，DefaultMessages 仅在 bundle 加载失败时兜底（D22）。

["err.shared.auth.required"]
other = "请先登录！"

["err.shared.auth.token_missing"]
other = "token不能为空，请先登录！"

["err.shared.auth.token_invalid"]
other = "token有误！"

["err.shared.auth.token_expired"]
other = "登录已过期，请重新登录。"

["err.shared.auth.forbidden"]
other = "无权执行此操作。"

["err.shared.rate.limited"]
other = "请求过于频繁，请稍后再试。"

["err.shared.param.invalid"]
other = "请求参数无效。"

["err.shared.not_found"]
other = "资源不存在。"

["err.shared.internal"]
other = "服务器内部错误。"
