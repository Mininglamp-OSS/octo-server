pr_868_round_4_fixed:
  - id: the-number-carrying-the-severity-call-was-twenty-times-too-big
    severity: medium
    reported_by: "mochashanyao P2-1 (Octo-Q); yujiawei flagged the same arithmetic independently"
    where: modules/project/space_member_removal.go; this file
    what: |
      The comment justifying "P2, not blocking" for the residual D6 violation put the page budget
      at 十万行 (100,000). cascadePageSize = 200 and cascadeMaxPages = 25, so it is 5000 -- as the
      constants' own comment says at :40, and as the SAME comment block says twenty lines earlier
      ("走同样的前 5000 行"). The error is in the direction that flatters the decision: it claimed
      twenty times more safety margin than exists, for accepting an invariant violation that D7
      blocks manual repair of and no scan reports.
      A second sentence was wrong the other way: "the retry could not pass page one". `after`
      resets per invocation, so a retry re-walks all 25 pages and simply never advances past row
      5000.
      I had also repeated the reviewer's own earlier 100k figure without checking it. Both of us
      carried it for two rounds.
    fix: |
      Both corrected in code and in this file, with the arithmetic spelled out (25 x 200) so the
      next reader can check it in one line rather than trusting it, and the retry restated as
      re-walking the budget rather than stalling at page one.
  - id: the-degrade-comment-was-wrong-on-count-shape-and-table
    severity: medium
    reported_by: "mochashanyao P2-2"
    where: modules/project/api.go
    what: |
      toResp's comment said the (total, 0) fallback "fires only after two consecutive COUNT
      failures over the same table". splitSeatCounts returns (total, 0) when countActiveSeatsByKind
      FAILS and the countActiveMembers fallback SUCCEEDS -- one failure, not two; two failures
      return (0, 0). And countActiveSeatsByKind is not a COUNT over one table: it is two SELECTs,
      over octo_project_member and then user. Wrong on the failure count, the statement shape and
      the table, in one sentence.
      This is the same class as the db_agent.go comment this PR already corrected twice for
      describing a statement that does not exist -- in the same file, in the same round.
    fix: "restated to how the code actually branches, with both failure paths named."
  - id: an-exemption-was-absorbing-an-unfiled-validation-defect
    severity: medium
    reported_by: "mochashanyao P2-3"
    where: modules/space/bot_deletion_census_test.go; modules/robot/api_manager.go
    what: |
      The updateRobotStatus exemption closed by noting that this door's 0 is the default for a
      malformed parameter. That sentence is not a product question -- it is an unvalidated write.
      Verified: status := ParseInt64OrDefault(c.Param("status"), 0) then robot.Status = int(status),
      with no check against the legal status set. PUT /robot/status/{id}/abc silently disables a
      bot; /999 writes 999 into a state column.
      The trap is specific to what this PR did: making d14ExemptDoors load-bearing means the census
      now asserts this door is FOUND, so it will never surface it as a finding again. A recorded
      exemption would have become permanent cover for a validation bug.
    fix: |
      The exemption text now separates the two explicitly -- the product decision is exempt, the
      parameter validation is not -- and points here. NOT fixed in code: this PR touches no
      modules/robot logic, and adding validation to a super-admin write is a behaviour change that
      wants its own test and review rather than a ride on a fast-follow.
    open: |
      modules/robot/api_manager.go updateRobotStatus must validate `status` against the legal set
      and refuse malformed input, instead of defaulting a parse failure to 0 (= disable). Same
      check belongs on robotUpdate's optional status field.
  - id: the-unreadable-shard-2-failure-was-identified-by-a-reviewer
    severity: low
    reported_by: "mochashanyao, P2 CI note"
    where: CI, E2E Test (2/4) at 94f85c17
    what: |
      I could not read which package failed -- get_job_logs caps returned content at ~8KB of tail
      and that tail was the WuKongIM teardown dump, the log archive and blob hosts are blocked by
      this environment's egress policy, and rerun-failed-jobs returns 403. The reviewer could read
      it: ~10 bot-settings cases dying at modules/robot/bot_setting_integration_test.go:60 with
      "sql: database is closed" -- a module this PR does not touch.
      Independently confirmed afterwards by the rebase onto c16f8c1, whose fresh full run passed
      shard 2. Two shards on this branch needed a runner-level retry within the hour, which points
      at the runner/service-container layer rather than at any package.
    fix: |
      Nothing in this PR. Recorded because the diagnosis cost a round, and because the mitigation
      ci/run-e2e-shard.sh already carries (reprint the FAIL lines last) is defeated by the
      service-container dump that follows the step -- the summary should also go to
      $GITHUB_STEP_SUMMARY, which is served by a separate API. Proposed on the PR, not pushed.

pr_868_round_5_fixed:
  - id: the-raw-sql-matcher-missed-the-spelling-this-table-already-uses
    severity: medium
    reported_by: "mochashanyao (Octo-Q) P2-1"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The three raw-SQL regexes were applied per *ast.BasicLit, so a statement split across
      concatenated literals matched neither half: `"UPDATE robot SET " + "status=0 WHERE ..."`
      leaves the first fragment with an empty SET clause and the second not beginning with
      UPDATE. Concatenation is the LIVE style on this very table -- botfather/db.go's two CAS
      writes are built that way -- so this is not a hypothetical spelling. A disable written
      like it was invisible: not a primitive, not status-capable, its caller never a door, and
      the census green while the deletion skipped D14.
    fix: |
      foldConcatenatedString flattens the `+` tree; matchRawSQL extracted so the folded and the
      single-literal paths run the SAME three regexes (two hand-copied rule sets is how the
      split-spelling hole got in on the dbr side in the first place).
    mutation: "deleting the fold case reddens both concatenation fixtures. Verified."
    regression_check: |
      The live tree's classification is byte-identical after the change -- 3 primitives, 2
      status-capable writers, the same 6 doors. In particular bindRobotCAS / unbindRobotCAS
      still do NOT match: they carry status=1 in the WHERE, and the SET-clause capture excludes
      it. That was the thing to check, since folding can only ADD matches.
  - id: the-fold-first-aborted-on-non-literals-and-that-was-backwards
    severity: medium
    reported_by: "self, mutation-testing the fix above"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The first draft returned "" for the whole expression when any fragment was not a literal,
      on the reasoning that stitching around a gap invents adjacency. Mutation testing showed
      the trade is backwards: aborting MISSES real disables (`"UPDATE robot SET status=0 " + v +
      " WHERE x"` reports as nothing), while skipping's failure mode -- inventing `status=0` out
      of `"... SET status" + x + "=0"` -- is a false primitive, i.e. a false door and a LOUD red.
      This file takes loud over silent everywhere else, because a missed deletion is a bot
      leaving with its Space seats open and nothing reporting it.
      Worse, my first fixture for this did not pin it at all: it began `"UPDATE robot SET
      status=" + ...`, and that first literal already matches on its own, so the case passed with
      the fold and without it. The mutation is what exposed that -- a fixture written to
      demonstrate a rule, which the rule's deletion left green. Same defect as the file's subject,
      inside the fix for the file's subject.
    fix: |
      Non-literal fragments are skipped, not fatal. The fixture is rebuilt so NEITHER literal
      matches alone: `"UPDATE robot SET " + placeholder(v) + " status=0 WHERE robot_id=?"`.
      Kept the negative for the other direction: `"... SET " + col + "=0"` must not match, since
      the fused text names no column.
    mutation: "restoring the abort guard now reddens exactly that case. Verified."
  - id: the-counter-was-called-the-only-signal-and-is-not
    severity: medium
    reported_by: "mochashanyao (Octo-Q) P2-2"
    where: modules/project/space_member_removal.go; modules/project/metrics_all_member_group.go
    what: |
      Both the comment and the metric Help said this counter is the ONLY signal that the
      unvisited-projects state exists. When the budget is spent AND a sync failed, the function
      returns at the firstErr branch above and never reaches the observe call -- while leaving
      exactly the same residue. So the claim was stronger than the code on a path the code
      itself takes.
    fix: |
      Narrowed rather than widened, and the reason recorded: the error path returns an error, so
      the cleanup job retries up to removalCleanupMaxAttempts (20) -- observing there would emit
      twenty points for one removal, against this counter's one-point-per-removal meaning -- and
      it has not run the `remaining` probe, so it would also fire on the exact-multiple case that
      is actually complete. That path has its own signal: the abandoned job and releaseCleanupJob's
      error log. Comment and Help both now say which case each signal covers.
  - id: the-never-been-GA-justification-is-contradicted-by-the-repos-own-tags
    severity: medium
    reported_by: "mochashanyao (Octo-Q) P2-5"
    where: modules/project/model.go; the journal; this file; the PR description
    what: |
      The member_count realignment was justified as "the module has never been GA, so nothing
      had shipped against either meaning". v1.18.0 (2026-09-07) ships 42 files under
      modules/project INCLUDING Resp.member_count, filled from countActiveMembers -- the total.
      Verified: `git ls-tree v1.18.0 -- modules/project | wc -l` = 42, and
      `git tag --contains 566e625` (the humans-only redefinition) is empty.
      The conclusion survives and the argument is stronger once corrected: this restores the
      meaning that IS in a release tag and retires the one that never reached one, so a v1.18.0
      client is unaffected. But the recorded reason was false, and it is the sentence a future
      wire change will cite.
    fix: "corrected in all four places, stated as a tag check rather than as a GA status."
  - id: the-open-item-ledger-still-described-the-retired-meaning-as-current
    severity: low
    reported_by: "mochashanyao (Octo-Q) P2-4"
    where: this file, open_verification
    what: |
      The first open_verification entry still listed three items including "the client blast
      radius of member_count counting humans only (D16)" -- both the count (two remain) and the
      description (that meaning is what this PR retires) wrong, so a reader following the ledger
      would go verify semantics that no longer exist. The same sweep had correctly updated
      project-p2-product-surfaces/brief.md and stopped one file short.
    fix: "entry rewritten: D2 and D14 remain open, the member_count item is recorded as resolved here."
  - id: carried-forward-not-fixed
    severity: low
    reported_by: "Jerry-Xin (P2 advisory); mochashanyao P2-3"
    what: |
      Two guard-completeness gaps are acknowledged and NOT fixed in this round, deliberately:
        - An UNCALLED status-capable writer escapes the census. Uncalled primitives get their own
          door; uncalled status-capable writers only become doors through callers. Probe-verified
          by the reviewer: injecting one leaves the census green with the door set at 6. Zero live
          instances.
        - "Both fail loudly, not silently" in the Known limits header is only true of the first
          half; the same-named-non-primitive exclusion (primitives[f.name] == nil) is silent. No
          name collision exists today.
      Both want the same shape of fix (extend the uncalled rule to status-capable writers with the
      same exemption lookup; make the self-exclusion identity-based) plus one assembly fixture
      each. That is a mechanism change to the assembly, and this round already changed the
      classifier; doing both at once is how the last four rounds each produced the next round.

