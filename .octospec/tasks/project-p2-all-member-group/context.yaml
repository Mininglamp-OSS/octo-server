# PR #855 fourth pass (yujiawei on head 1142ad5). Spec came back green; three new
# blocking findings, two of which this project put there in the round before.
pr_855_round_3_fixed:
  - id: writeback-was-not-fenced-on-the-lease-it-claimed
    severity: blocking
    where: modules/project/db_all_member_group.go setAllMemberGroupNo
    what: |
      Round 2 fenced releaseAllMemberGroupProvision on the claimed deadline.
      setAllMemberGroupNo never got the other half: its only guard was "the
      pointer is still empty".
    why_that_was_wrong: |
      The comment argued exactly one ordering -- the successor writes back first,
      so the late one finds a non-empty pointer and loses -- and that ordering is
      self-consistent. The reverse was not considered: A claims, runs past its
      lease, B claims and builds from the CURRENT roster, then A returns FIRST and
      writes back. The pointer is still empty, so A wins with its older snapshot.
    consequence: |
      The project names the group built from the stale roster; everyone added in
      the window is missing from it, and B group -- which has the complete roster
      -- survives as an ordinary project group, so the Space shows two groups
      named after the project. Lease expiry is not exotic here: the constant own
      comment sizes 2 minutes against the IM channel call as "the only part that
      can take minutes".
    fix: "the claimed deadline is threaded into the writeback as an equality fence. Correct in both directions: an expired-but-UNCLAIMED lease still holds the claimant own deadline, so a late write with no successor still lands."
    test: |
      all_member_group_lease_test.go -- the lease PROTOCOL, not the rebuild
      inputs. Two properties: exactly one group ever carries the pointer, and the
      one that does is built from the later roster. Confirmed non-vacuous by
      removing the fence and watching the stale write win.
    note: |
      The review asked for exactly this test and named why the previous round
      invariant test did not catch it: that one exercises the rebuild INPUTS,
      while what was unguarded is the protocol AROUND it -- which of two
      concurrent attempts becomes authoritative.
  - id: roster-truncation-became-silent
    severity: blocking
    where: modules/project/service_all_member_group.go / db_all_member_group.go
    what: |
      queryActiveMemberUIDsForRebuild was called with LIMIT = maxMembers while the
      caller checked len(roster) > maxMembers, so the check was unreachable.
    why_that_was_wrong: |
      Round 2 relaxed >= to > in response to a nit (>= also fires on a project
      legitimately at exactly max_members) and did not change the limit. The
      correct answer to that nit is to fetch maxMembers + 1 and keep >. So the
      round that was fixing a false-positive removed the only true signal, in a
      commit whose own heading reads "the roster is NOT truncated, this is a
      decision" -- while the code truncated anyway, at a bound updateProject can
      lower below the current seat count with no check.
    fix: "fetch maxMembers + 1, keep >, drop the probe row before seeding."
    test: TestRebuildWarnsWhenTheRosterIsTruncated
  - id: bot-deletion-continued-past-a-failed-seat-close
    severity: blocking
    where: modules/botfather/command.go onDeleteConfirm
    what: |
      CloseAllSpaceSeats returning an error was logged and the flow continued to
      deleteRobot. The comment justified that with two claims, and the review
      showed both are false.
    why_those_claims_were_false: |
      "I1 will report it" -- I1 looks for an active project seat whose SPACE seat
      is gone. In this failure the Space seat is still ACTIVE (the UPDATE never
      ran, or rolled back). No scan in this repository looks for an active
      space_member row whose robot row is status = 0.
      "Retrying the whole delete is idempotent" -- deleteRobot sets
      robot.status = 0, and the bot selection query requires status = 1, so the
      owner can never reach that bot again.
    consequence: |
      A bot the user deleted keeps an active Space seat in the failed Space,
      therefore an active project seat, therefore keeps satisfying the I2 gate and
      stays a reading member of that project groups -- permanently, invisible to
      every scan, with no user-reachable repair. Exactly the end state D14 exists
      to eliminate, and LESS observable than the raw UPDATE it replaced (that one,
      when it succeeded, left a state I1 could see).
    fix: "abort before deleteRobot and reply MsgDeleteFailedRetry. The robot row is still status = 1 at that point, so the retry the message promises actually works."
  - id: scan-b-double-reported-scan-a-problem
    brief_ref: Q2
    what: |
      Scan B base population required only that the pointer be non-empty. A
      project pointing at a DISBANDED group is therefore in it -- and group_member
      rows survive a disband (only group.status flips; the member cleanup is an
      async event that can fail), so the join keeps finding them until that
      cleanup lands and then finds none of them at once. Scan A already reports
      that project as one row.
    note: "The scan own doc comment claimed this exclusion. It only covered the empty-pointer case."
    fix: "exemption 5, in the violating flag with scan A join shape, so the two agree on usable."
    test: TestI4ScanBDoesNotDoubleReportScanAsProblem
  - id: assorted
    fixes: |
      Q5: the owner-candidate cap was a self-chosen 16 with nothing bounding a
      project to 16 owners; if the sixteen most senior were all I1 leaks the
      rebuild failed forever -- a narrow version of the P1 fixed last round. Now
      bounded by max_members, which is the meaningful bound (owners are a subset
      of members).
      Q6: bot_api guard copy read group.project_id itself, so a Space-direct group
      paid one query where C1 budgets zero. project_id now rides along with the
      status the handler already reads for its disband check.
      Q7: reasonAdmitRaceLost renamed admit_skipped_no_group -- the arm cannot
      tell a lost race from a failed provision, so a name that says "race" reads
      as a concurrency signal while double-counting provisioning failures.
      Q4: agent eligibility now includes the account itself
      (u.status = 1 AND COALESCE(u.is_destroy, 0) <> 2), matching the contact
      directory that D2 says it matches. Read as a separate flag rather than
      filtered in the WHERE, so a deactivated bot does not fall through to the
      HUMAN branch -- which is the shape of the hole closed two rounds ago.
      Nits: the D7 header said "four operations" while five are guarded; the brief
      D7 paragraph now names blacklist and the bot_api copy, and records that
      IsAllMemberGroup real signature is narrower than D5 wrote.
      Two stale spec-record entries corrected: declared_deviations still said the
      banned-Space exemption was not implemented, and open_verification still
      asked the deploy team to budget for TWO indexes after one was dropped. The
      second was a live instruction to whoever runs the migration.
  - id: transfer-not-disband-is-the-fail-open-outlier
    brief_ref: Q1
    what: |
      The open_verification entry asking whether the D7 guard should fail CLOSED
      was aimed at DISBAND, following the third-round reviewer. The fourth round
      showed that aim is backwards.
    detail: |
      The fail-open argument is that the worst case leaves a state a scan reports.
      remove / exit / blacklist leave member-set gaps (scan B); disband leaves a
      project pointing at a disbanded group (scan A, then the stale-pointer clear
      and a rebuild). TRANSFER is the one where it does not hold: a group-side
      owner transfer that slips through leaves the all-member group creator on
      someone who need not be a project owner, and no scan checks that relation.
      D6 own comment already describes the resulting state -- a group owner nobody
      can change, since D7 then refuses them transfer, exit and disband.
    status: "re-aimed in open_verification, still a product call rather than decided here."

# PR #855 fifth pass. Two reviewers on the same head (yujiawei, and Jerry-Xin
# joining), converging independently on the same two blocking items.
pr_855_round_4_fixed:
  - id: collate-placement-made-the-probe-index-unusable-on-user-traffic
    severity: blocking
    where: pkg/project/all_member_group.go IsAllMemberGroup, and modules/project/db_all_member_group.go queryAllMemberGroupNo
    what: |
      The repo rule is "put the explicit COLLATE on the driving side's values so
      the driving table's indexes stay usable". That is true and it hides the
      cost: an explicit COLLATE has coercibility 0, so the COMPARISON is in that
      collation and the OTHER side must be converted per row -- its index cannot
      serve it. `group.group_no` is 0900_ai_ci in production; group_groupNo, its
      UNIQUE index, was unusable.
    measured: |
      Reproduced locally on MySQL 8.0.46, `group` at 0900_ai_ci / 5000 rows:
        shipped join:  p const uk_octo_project_project_id 1 row
                       g ALL   possible_keys=group_groupNo  key=NULL  rows=5000
        split reads:   p const uk_octo_project_project_id 1 row
                       g const group_groupNo               1 row
    consequence: |
      IsAllMemberGroup is the WHOLE of the D7 guard, reached from six user-facing
      handlers (group disband / exit / member removal / owner transfer / blacklist,
      and the bot API member removal). A full scan of `group` -- a core IM table --
      on every group exit. In P0 and P1 this shape only touched background scans;
      P2 is the first time it reached request traffic.
    fix: |
      Both predicates split into two single-table reads with NO cross-schema
      comparison. Deliberately not "move the COLLATE to the legacy side": that is
      correct today and silently wrong in the mirror direction the moment the
      collation conversion lands. A comparison that crosses no schemas needs no
      collation opinion.
    not_fixed: |
      The two paged reconcile scans cannot be split that way. Their comment
      claiming a per-row index dive was corrected to state the measured plan
      (`g ALL`, plus `Using temporary` defeating the ORDER BY / LIMIT paging), and
      open_verification now carries that as the EXPLAIN item rather than an
      assumption. They inherit P0/P1's pending conversion and are bounded by
      ReconcileLimit and a 5-minute interval meanwhile.
    note: "CI creates its database with general_ci on both sides, so every one of these plans is const there. P0's migration header says exactly this -- a green suite is structurally not evidence."
  - id: the-one-query-optimisation-loosened-a-fail-closed-bot-guard
    severity: blocking
    where: modules/bot_api/send.go queryGroupStatusAndProject
    what: |
      Round 4's Q6 fix merged isGroupDisbanded's lookup with the D7 guard's
      project_id read, replacing LoadOne with Load. A missing group row therefore
      became (status 0, "", nil) -- "not disbanded" -- instead of dbr.ErrNotFound.
    consequence: |
      errBotSendPermGroupNotFound and the sendPermissionReasonNotFound metric,
      whose job is to separate "a bot is probing channel ids that do not exist"
      from "a query failed", became unreachable through the DB. On the OBO send
      path the disband guard was the ONLY existence check (checkOBO returns early
      with an enabled scope row). And modules/bot_api started answering
      differently from modules/robot and modules/message on the same question,
      while its own doc comment still claimed the not-found signal was preserved.
    why_the_suite_was_green: |
      Both "missing group" cases drive groupStatusQueryOverride -- the stub seam,
      which the change did not touch. The changed branch had no test at all.
    fix: "the not-found signal is wrapped and propagated; the D7 half short-circuits on projectID == \"\" independently. Two tests drive the REAL query with no stub."
    self_assessment: "This was mine, introduced to save one query for a P2 latency nit, on a PR labelled security-sensitive. The reviewer's framing is the right one."
  - id: admission-subscribed-the-parent-channel-but-not-its-threads
    severity: blocking
    where: modules/group/all_member_group.go admitToAllMemberGroup
    what: |
      Each thread is its own WuKongIM channel with its own subscriber list, and
      send permission is checked against that list. Every other admission path in
      the module pairs IMAddSubscriber with addUsersToGroupThreads -- memberAdd,
      groupScanJoin, un-blacklist, Service.AddGroupMembers, event.go -- and removal
      is symmetric. The all-member admitter had only the first half.
    consequence: "a member added to a project could not post in the all-member group's threads and did not receive them: permanently (the admitter runs once per join) and invisibly (I4 scan B reads group_member rows, not subscriptions)."
    fix: "addUsersToGroupThreads after the parent subscribe, held by a source guard on the pairing -- the effect itself is not assertable, since nothing here can read the broker's subscriber table back."
  - id: two-fixes-shipped-without-anything-pinning-them
    severity: blocking-adjacent
    raised_as: "Jerry-Xin P2-5, by mutation testing"
    what: |
      Reverting round 4's botfather abort to log-and-continue left the entire
      modules/botfather suite GREEN. Removing the +1 probe row from the roster
      query left TestRebuildWarnsWhenTheRosterIsTruncated GREEN -- a test named
      for the warning, asserting only the bound, which is identical either way.
    why_it_matters: "both are fixes the previous two rounds BLOCKED on, one revert away from returning with nothing going red."
    fix: |
      A closeSeatsFn seam in botfather plus two cases (abort on failure with the
      robot row still selectable; proceed on success). And the truncation is now a
      COUNTER, not only a log line -- a signal that exists only in a log cannot be
      asserted, which is how it got deleted silently once already.
    both_verified: "by re-running the reviewer's mutations: each test goes red."
  - id: comments-naming-detection-that-does-not-cover-the-residue
    raised_as: "Jerry-Xin P2-2"
    fixes: |
      CloseAllSpaceSeats's partial-failure comment said "I1 will report it". I1's
      domain is octo_project_member ("project seat alive, Space seat gone"); this
      residue is the opposite and no scan looks for it. The comment now says so and
      names the real backstop -- botfather aborting the deletion.
      The provisioning !ok Warn named only one of its three cases and routed the
      on-call reader to scan A for all of them; it now names all three (pointer
      taken, lease taken with the pointer still empty, project disbanded -- the
      last being I3's domain, not A's).
  - id: spec-record-and-journal-drift
    raised_as: "Jerry-Xin P2-1 / P2-3 / P2-4"
    fixes: |
      db.go's comment called octo_project_member a legacy table while the two lines
      above it say it is pinned -- and the consequence is worse than a wrong word:
      that pre-existing join raises 1267 under the production shape, so listMembers
      (D16's roster surface) cannot execute at all until the conversion lands. Added
