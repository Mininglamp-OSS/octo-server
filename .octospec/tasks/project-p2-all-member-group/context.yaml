# octospec Implement-phase record for task project-p2-all-member-group.
#
# Rule resolution: .octospec/_global/ is NOT synced in this worktree (no global
# tier available), so every injected rule resolves to the repo tier.
#
# inject_when is a union of paths-glob and touches-tag (see _index.yaml).
# The brief's tags are: space, isolation, acl, error-response, i18n, rate-limit,
# wire-contract, migration, testing, commit. All six repo rules match.
injected:
  - id: space-isolation
    source: repo
    priority: 92
    load_bearing: true
    why: |
      paths modules/**/*.go matches every file this task touches; brief tags
      carry space / isolation / acl. Drives: the all-member group is created
      with the project's own space_id and project_id so I2 keeps gating it;
      agent eligibility (D2/D15) is decided server-side inside the create
      transaction with a locked space_member read, never from the client's
      agent_uids list; D13 closes an agent's seat by robot.creator_uid, the
      same field the group side already uses, so the two cannot disagree about
      whose agent it is; D14 routes bot deletion through the Space removal
      outbox so the seat-closing cascade actually runs for bots.
  - id: error-handling
    source: repo
    priority: 85
    load_bearing: true
    why: |
      paths modules/**/*.go + pkg/errcode/**; brief tags error-response / i18n /
      wire-contract. Drives: err.server.project.agent_not_eligible and
      err.server.group.all_member_group_protected registered in pkg/errcode,
      httperr.ResponseErrorL everywhere, 5xx <=> Internal=true, zh-CN
      translations, i18n-extract-check + i18n-lint, and adding every new file to
      TestGroupNoLegacyResponseError / TestProjectNoLegacyResponseError (both
      scan fixed file lists and cannot see a new file on their own).
  - id: rate-limit
    source: repo
    priority: 80
    load_bearing: true
    why: |
      paths modules/**/*.go; brief tag rate-limit. The task adds no route --
      agent_uids rides the existing create route and the agent rules ride
      members/add|remove, both already behind AuthMiddleware +
      SharedUIDRateLimiter. Binds two ways: the provisioner / admitter hooks and
      the I4 scans are not HTTP paths and must not grow a Redis counter, and the
      D4 rebuild lease is a correctness lease on a table row, not a rate limiter.
  - id: trust-boundary
    source: repo
    priority: 90
    load_bearing: true
    why: |
      Matched by touches:wire-contract, not by paths -- no inbound adapter, no
      markdown rendering, no URL destinations. Two clauses apply. "Bound the
      payload": agent_uids is capped at MemberBatchMax (200) like every other
      member batch. And the anti-enumeration shape: the six agent-ineligibility
      reasons collapse to one code with the submitted uids echoed back, so
      "not yours" / "not a bot" / "another Space" / "does not exist" are
      byte-identical on the wire, matching P1's project_unavailable precedent.
  - id: testing
    source: repo
    priority: 70
    load_bearing: false
    why: |
      paths **/*_test.go. Drives: testutil.NewTestServer + CleanAllTables,
      explicit ratelimit:uid:* reset on UID-limited routes, and the
      non-regression rule that no EXISTING test file may be edited -- an edited
      assertion is a changed contract. New behaviour lands in new test files.
  - id: commit-style
    source: repo
    priority: 60
    load_bearing: false
    why: paths ** -- English Conventional Commits; PR description in English.

brief: .octospec/tasks/project-p2-all-member-group/brief.md

# Confirmed by the requester on 2026-09-07: D1-D17 all take the brief's
# recommended defaults. D6 / D7 / D8 are in scope (their "optional" markers were
# removed in that same confirmation).
scope_changes: []

# Assumptions taken where the brief left a choice; each reversible at one site.
assumptions:
  - id: d14-keeps-the-synchronous-group-loop
    decision: |
      D14 replaces ONLY botfather's raw `UPDATE space_member SET status=0` with
      the transactional outbox entry. Its existing synchronous group-removal
      loop stays exactly as it is.
      Why: the loop enumerates the bot's groups with GetGroupsWithMemberUID,
      which is NOT Space-scoped, while the outbox is keyed (space_id, uid) and
      its group step queries queryGroupsWithMemberUIDAndSpaceID. Replacing the
      loop with the outbox would silently drop every group whose space_id is ''
      -- a coverage regression dressed up as a refactor. Keeping both is safe
      because the group step is idempotent by construction: it re-reads the
      member row and returns nil when the row is already gone.
      The brief's own Out of scope says D14 只接 Space 席位这一段, so this is
      the reading it intends; recorded because "route bot deletion through the
      outbox" could be read as replacing the loop.
  - id: bot-deleted-is-its-own-removal-reason
    decision: |
      A new MemberRemoveReasonBotDeleted = "bot_deleted" rather than reusing
      MemberRemoveReasonForceRemoved (the brief allowed either).
      Why: the group cascade branches on Reason to decide whether to emit the
      "X 被 Y 移出群聊" system message. botfather today passes
      SuppressRemoveNotice: true and says in a comment that keeping it that way
      is deliberate -- the sentence is factually wrong for a globally deleted
      bot. Reusing force_removed would make the cascade emit that message into
      every group the synchronous loop failed to clean, which is precisely the
      "a refactor changed user-visible behaviour" failure the same comment warns
      about. A distinct reason lets the group step suppress it by name.

# Defects found DURING implementation, by the repo's own guards. Recorded because
# each one was a real hole in the change, not a test being fussy.
defects_found:
  - id: create-took-the-joining-seat-lock
    where: modules/project/service.go createProjectOnce
    what: |
      The first version locked the agents' Space seats with lockSpaceSeatsTx,
      which JOINs `space`.
    why_it_matters: |
      A table outside that statement's `FOR SHARE OF` list is read as a
      CONSISTENT read, which OPENS the transaction's read view. In
      createProjectOnce it would have been the first such statement, so every
      creation quota counted afterwards would answer from a snapshot taken
      before the `space` row lock -- the exact defect P0 closed and documented
      (six concurrent creates all passed MaxPerSpace=1).
    caught_by: TestCreateDoesNotTakeItsSpaceSeatLockThroughAJoin
    fix: |
      New lockSpaceSeatRowsTx: the batch form of lockSpaceSeatRowTx, one
      statement, no JOIN. Nothing is lost -- createProject rechecks the Space
      under the exclusive `space` lock immediately afterwards.
  - id: agent-seat-read-was-not-a-locking-read
    where: modules/project/db_agent.go queryOwnedAgentSeatsTx
    what: |
      D13 read the departing member's agent seats with a plain SELECT inside the
      removal transaction.
    why_it_matters: |
      The read view opens at the transaction's first statement, so an agent seat
      committed after that is invisible: the owner leaves, the agent's seat stays
      active, and nothing revisits it. That is the precise end state D13 exists
      to prevent, reintroduced by the query meant to prevent it.
    caught_by: TestNoWriteAuthorisingAggregateIsANonLockingRead
    fix: "FOR UPDATE OF pm -- locking, and scoped so `robot` (outside the declared lock order) is not locked."
  - id: collate-applied-between-two-legacy-tables
    where: modules/project/db_agent.go queryAgentRowsTx
    what: "An explicit COLLATE on `robot` JOIN `user`, both of which are legacy tables."
    why_it_matters: |
      P1's reconcile header states the rule in both directions: crossing the two
      schemas needs COLLATE, and adding one between two same-collation columns
      makes the predicate non-sargable, giving up the index for nothing. The
      first version got the second half wrong.
    caught_by: "review, prompted by the P1 header; the drift test then confirmed the corrected form"
    fix: "COLLATE removed there; kept only where octo_project* meets group/group_member/user/robot, always on the driving side's values."
  - id: roster-join-broke-the-collation-probe
    where: modules/project/review8_collation_test.go
    what: "listMembers now LEFT JOINs `robot`, which the drift probe database did not create."
    why_it_matters: |
      Not a code defect but a coverage one: without the table the probe failed
      with "table doesn't exist" instead of the 1267 it asserts, so the drift
      evidence for the roster query silently stopped being evidence.
    fix: "`robot` added to collationProbeTables as a legacy table (it is one, created in 2019 with no COLLATE)."

# Scoped out during implementation, with the reason. NOT silently dropped.
not_delivered:
  - id: d7-guard-not-behind-a-tree-walking-source-guard
    what: |
      A guard that a NEW group handler mutating membership must consult
      refuseIfAllMemberGroup.
    why_not: |
      The forbidden thing is not a syntactic pattern -- it is "a new handler that
      changes who is in a group", which no string match identifies. What IS
      pinned is the inverse and it is the load-bearing half:
      TestAllMemberGroupProtectionIsNotInTheServiceLayer stops the refusal from
      being pushed down into the primitives, where it would block the cascades
      that maintain I2 and I4.
    consequence: "A future handler added on the four protected shapes has to remember the guard; the I4 reconcile scans are what would report the resulting drift."

# Corrections to earlier entries in this file, kept rather than edited away so the
# reasoning that was wrong stays visible.
corrections:
  - id: end-to-end-coverage-was-wrongly-scoped-out
    superseded: real-provisioner-covered-only-indirectly
    what_was_claimed: |
      That the seam between modules/project and modules/group could not be tested
      end to end, because modules/project must never import modules/group.
    why_that_was_wrong: |
      The import ban constrains the PACKAGE, not the test BINARY. The external
      test package modules/project/project_external_test.go already blank-imports
      octo-server/internal, so module.Setup registers every module and
      modules/group's real provisioner, admitter, owner sync and rename are all
      live in that binary. The claim also conflated two obstacles: the import
      rule, which does not apply, and the absence of a WuKongIM broker in the
      development environment, which is an environment gap and not a design
      constraint. Raised by the requester.
    what_was_done: |
      modules/project/all_member_group_e2e_test.go: seven cases through the REAL
      modules/group implementation, covering create with agents, add, remove with
      the agent cascade, disband, the D7 refusals, rename, and D14's bot deletion
      closing a project seat. They assert on the actual group and group_member
      rows, not on stand-in call counts.
  - id: stand-ins-were-not-restoring-the-real-hooks
    what: |
      stubAllMemberGroup installed stand-in hooks and deliberately did not restore
      them, on the reasoning that the registry is latest-wins and every case that
      cares installs its own.
    why_that_was_wrong: |
      The end-to-end cases care and do NOT install their own -- they depend on the
      real hooks module.Setup registered. Since the registry is process-wide, an
      in-package case leaving a stand-in behind disabled the feature for every
      later case in the same binary. The symptom was the honest one: all seven
      end-to-end cases passed when run alone and failed in a full run.
    fix: |
      Snapshot/restore added to the registry and used by every case that installs
      a stand-in. modules/space's member-removal registry carries the same warning
      about the same hazard; this now follows it. Verified under
      `go test -race -shuffle=on`.

# Findings from /code-review (high effort) on the full branch diff. All eight were
# real; all eight are fixed on this branch. Listed because several were defects
# the implementation's own tests could not have caught -- the stand-ins agreed
# with the bug.
review_findings_fixed:
  - id: rebuild-seeded-the-immutable-creator
    severity: highest
    what: |
      ensureAllMemberGroup passed octo_project.creator as the group owner.
    why: |
      That column never changes. Once the founder has left the project, the
      admission gate refuses them -- they are not an active member -- so every
      rebuild claimed the lease, failed, released it, and the project could NEVER
      get its group back. Reconcile scan A would report it forever with nothing
      able to repair it, which is precisely the failure the rebuild exists to
      prevent.
    fix: "queryActiveOwnerForProvision (senior active owner, same rule as pkg/project.PickActiveOwner); skip with a Warn when the project has no owner."
    test: TestRebuildUsesAnActiveOwnerNotTheOriginalCreator
  - id: project-side-lookup-checked-only-half-the-predicate
    severity: high
    what: |
      queryAllMemberGroupNo read the project pointer without verifying the group
      still carries project_id, while pkg/project.IsAllMemberGroup checks both.
    why: |
      After P1 detaches a group to Space-direct (creator left, no successor -- a
      state scan A documents as unclearable), the pointer remains. The admitter
      would then put new project members into a group the project no longer owns,
      the rename would rename it, and the owner sync would change its creator.
      Two predicates answering the same question differently.
    fix: "the lookup now joins `group` and requires status <> disband AND project_id = the project."
    test: TestQueryAllMemberGroupNoIgnoresADetachedGroup
  - id: blacklist-was-a-fifth-unguarded-removal-path
    severity: high
    what: |
      The blacklist handler flips group_member.status to Blacklist and
      unsubscribes from IM, with no D7 guard.
    why: |
      For I4 that is identical to a removal -- the uid stays a project member and
      leaves the all-member group active set -- but it does not go through
      RemoveGroupMembers and is not called "remove", so it was missed. Nothing
      repairs the resulting scan-B gap: the project seat is unchanged and the
      admitter only runs on a fresh add. Same shape as P1's A11.
    fix: "guarded on action=add only; un-blacklist stays open because it restores a member and is already under the I2 gate."
  - id: owner-sync-missed-the-common-departure
    severity: high
    fix: "syncAllMemberGroupOwner now runs on every successful leave and every successful removal, not only when a successor was promoted."
    why: |
      A non-last owner leaving names no successor, so the sync was skipped -- but
      P1's cascade then hands the group over by GROUP seniority, which can land on
      an ordinary project member whom D7 forbids from transferring, leaving or
      disbanding it. The hook is self-deciding and idempotent, so the two do not
      race: whichever runs last converges on "the creator is an active owner".
  - id: member-count-meant-two-things
    severity: medium
    fix: "the list query splits humans and agents with two bounded correlated subqueries, so list cards and the detail route agree (D16)."
  - id: agent-check-ran-before-the-permission-gate
    severity: medium
    what: |
      An ordinary member got a per-uid agent_not_eligible for somebody else's live
      bot and an actor-level permission_denied for a human.
    why: |
      That is the enumeration oracle ErrProjectAgentNotEligible was registered to
      prevent, handed to the least privileged caller there is.
    fix: "ownership is decided first, then the permission gate; the agent-specific refusal is only reachable by a caller who already holds member-management rights."
    test: TestAnOrdinaryMemberCannotTellAnAgentFromAHuman
  - id: quota-refusal-reported-the-global-cap
    severity: low
    fix: "effectiveMaxMembers(in.MaxMembers), so a per-request max_members override is reported as the limit the refusal was measured against."
  - id: rename-idempotence-compared-untruncated-names
    severity: low
    fix: |
      Compare the truncated name. A project name over 50 runes never equalled the
      truncated group name, so every update carrying `name` re-renamed the group
      and pushed a version bump to every member -- an idempotence check that was
      constant-false exactly on the longest names.

# Second /code-review pass, after the eight fixes above. The original eight were
# confirmed gone; six NEW findings, all real, all fixed. Recorded separately
# because one of them was caused by a fix in the first round -- a tightened read
# without the matching write.
review_round_2_fixed:
  - id: tightening-the-read-deadlocked-the-rebuild
    severity: highest
    caused_by: project-side-lookup-checked-only-half-the-predicate
    what: |
      Round 1 made queryAllMemberGroupNo verify the group side. The claim CAS was
      left keyed on all_member_group_no being empty, and P1 leaves the pointer set
      when it detaches a group.
    why: |
      The lookup then said "no group" while the claim said "already has one", so
      ensureAllMemberGroup proceeded and the claim failed on every attempt -- with
      no error and no metric. The rebuild never ran, every later admission
      no-opped, and scan A reported a project nothing could repair. Two predicates
      disagreeing about one fact: the same shape as the bug round 1 was fixing.
    fix: "clearStaleAllMemberGroupPointer, run by ensureAllMemberGroup before the claim, with a Warn so the correction is visible."
    test: TestRebuildRecoversAProjectWhoseGroupWasDetached
  - id: list-route-omitted-the-group-pointer
    severity: high
    fix: "listVisibleInSpace selects all_member_group_no. Omitting it made every listed project report the empty sentinel, which the contract defines as 'no group provisioned' -- the list and the detail route disagreeing about the same project."
  - id: bot-api-removal-bypassed-d7
    severity: high
    what: "modules/bot_api's member-remove calls the service-layer primitive directly, so the Web-side D7 guard does not cover it."
    why: |
      A bot admin could take an ordinary member out of an all-member group while
      their project seat stayed active. I4 broken with nothing to repair it: the
      seat is unchanged, so no cascade revisits it.
    fix: "guarded there too, with its own bot_api error code; the service layer stays open, as D7 requires."
    note: "api_manager's removeMember re-dispatches into the guarded Web handler and was already safe."
  - id: reconcile-p2-header-claimed-coverage-it-did-not-have
    severity: medium
    what: "The file header said the P2 statements had been added to TestP1ScansSurviveCollationDrift. They had not."
    fix: |
      TestP2StatementsSurviveCollationDrift now runs the two I4 scans, the group
      lookup, the stale-pointer clear, the seat split and both pkg/project
      predicates against a drifted database and again after conversion. Writing it
      immediately paid: it caught that listMembers must NOT be in that list,
      because its pre-existing un-COLLATEd `user` join is what
      TestCollationDriftBreaks... asserts DOES fail under drift. Two contradictory
      contracts on one statement, avoided by running the test rather than
      reasoning about it.
  - id: sum-over-an-empty-roster-returned-null
    severity: low
    fix: "COALESCE around both SUMs in countActiveSeatsByKind. An empty active roster is reachable (P0's cascade can close the last seat) and scanning NULL into an int errored, making every detail read log a warning and fall back."
  - id: a12-was-missing-from-the-hard-coded-entry-lists
    severity: low
    what: "The new admission entry was not added to the two by-hand enumerations that ARE the I2 per-entry guarantee."
    fix: |
      Added to both, plus TestEveryAdmissionEntryConstantIsInTheGuardLists, which
      reads the constants out of admission.go and compares -- so the next entry
      cannot be forgotten the same way. Exactly the failure mode P1's D8 gives as
      the reason to prefer guards that enumerate over guards that match strings.

# Third /code-review pass, run on the pushed branch. Six findings, all verified
# against the code before fixing; the two audit gaps below were found while fixing
# them and are the same omission on the other write path.
review_round_3_fixed:
  - id: all-member-group-could-be-left-with-no-creator
    severity: critical
    where: modules/group/all_member_group.go ensureAllMemberGroupOwner
    what: |
      It read the successor's group_member row without a lock, promoted with
      UpdateMemberRoleTx (which affects zero rows on a soft-deleted row and reports
      no error), then demoted the sitting creator unconditionally.
    why: |
      A concurrent soft-delete of the successor's row between the read and the
      write leaves the group with NO creator -- and D7 then makes that unfixable
      from the group side: nobody can transfer, leave or disband it. The repo
      already had the answer: project_cascade.go:335 locks the successor FOR UPDATE
      and hard-fails if the promote did not land.
    fix: "SELECT 1 ... FOR UPDATE on the successor, updateMemberRoleIfLiveTx, and a hard error if !promoted BEFORE the demote."
  - id: i4-scan-a-filtered-in-the-where
    severity: high
    where: modules/project/reconcile_p2.go queryMissingAllMemberGroupPage
    what: "`g.id IS NULL` was a WHERE predicate, so LIMIT bounded rows RETURNED."
    why: |
      In the HEALTHY case the predicate matches nothing, so the statement walked
      the whole of octo_project with a `group` lookup per row, every tick. The cost
      was highest exactly when there was nothing to report. Same defect P1 fixed in
      queryI2Page, reintroduced.
    fix: "flag-over-base-page: (g.id IS NULL) AS violating, skipped in the loop."
    test: |
      TestReconcileP2QueriesAreBounded and
      TestP2PagedQueriesUseTheFlagOverBasePageShape, mirroring
      reconcile_p1_bounds_test.go -- neither existing guard read this file, which is
      how the regression got in. Confirmed non-vacuous by mutating the source and
      watching both assertions fire.
  - id: agent-refusal-echoed-every-submitted-uid
    severity: medium
    where: modules/project/api.go respondCreateError
    what: |
      ineligibleAgentUIDs was computed and only logged; details.uids carried the
      whole submitted list, contradicting D3 and the helper's own doc comment.
    why: "One bad uid in a batch of ten told the client all ten were refused, leaving the user to re-pick from scratch to find the one that was wrong."
    fix: |
      agentNotEligibleError carries the ineligible subset out of the transaction
      (Unwrap keeps errors.Is on the sentinel true, so the per-uid members/add path
      is unchanged). respondCreateError no longer TAKES the submitted list -- having
      it in scope is what made echoing it the easy thing to write.
    test: "TestCreateProjectRejectsTheWholeRequestOnOneIneligibleAgent now asserts the eligible agent is NOT named."
  - id: re-add-was-a-silent-no-op-for-the-documented-i4-repair
    severity: medium
    where: modules/project/service.go addMembers
    what: "admitAllMemberGroup ran only when the seat write changed something."
    why: |
      An I4 scan-B gap is exactly the state where the seat already exists, so the
      operator action the gauge points at -- an admin re-adds the member -- did
      nothing, quietly, however many times it was tried.
    fix: "the admission runs on every add that did not error. The cost is one idempotent round-trip per already-member; the projection being self-healing is worth it."
    test: TestReAddingAnActiveMemberReAdmitsThemToTheGroup
  - id: agent-seats-left-no-audit-trail
    severity: medium
    where: modules/project/api.go (create) and service.go (D13 removal)
    what: |
      The agent seats written inside the create transaction, and the agent seats
      D13 closes when their owner is kicked or leaves, emitted no audit entry.
    why: |
      The acceptance criterion is that every write path leaves one, and
      TestEveryWritePathEmitsAnAuditEntry passed vacuously here because it never
      sends agent_uids and seeds no agents. "How did this bot get access to the
      project" was unanswerable from the trail.
    fix: |
      auditMemberAdd with reason agent_on_create at create; auditMemberRemove with
      reason agent_follows_owner in the two post-commit loops that already
      invalidate the agents' caches (closedAgents does not leave the service, which
      is why the audit sits there rather than in the handler -- the same split
      space_member_removal.go uses).
    test: TestAgentSeatsAreAudited
  - id: new-code-orphaned-a-neighbours-doc-comment
    severity: low
    where: pkg/errcode/bot_api.go
    fix: |
      ErrBotAPIAllMemberGroupProtected had been inserted between
      ErrBotAPICannotRemovePrivileged's doc comment and its declaration, so that
      comment -- which describes uid Details -- documented a code that registers no
      SafeDetailKeys. Declaration moved back under its own comment, and the new code
      now says explicitly why it carries no detail keys.

# octospec Verify phase. Each injected rule re-read and checked against the diff,
# then the brief's Acceptance walked line by line.
verify:
  rules_rechecked:
    - id: space-isolation
      verdict: complies
      evidence: |
        `go list -deps ./modules/project | grep -c modules/group` = 0. pkg/project
        imports no modules/* and does not read `robot`. Agent eligibility is
        decided inside the create transaction against space_member rows locked in
        the same statement position as the creator's (lockSpaceSeatRowsTx), never
        from the client's list. D13 matches agents on robot.creator_uid, the field
        the group side already uses. The new bot_api guard sits AFTER that
        handler's existing bot-ownership and group-admin checks.
    - id: error-handling
      verdict: complies
      evidence: |
        All four new codes are 4xx with Internal unset; every new response goes
        through httperr. make i18n-extract-check, make i18n-lint, golangci-lint on
        all six touched trees: clean. The bot_api refusal uses
        ResponseErrorLWithStatus, matching the three 403 refusals already in that
        same handler rather than diverging from D14.
      note: |
        The brief expected TestGroupNoLegacyResponseError / TestProjectNoLegacyResponseError
        to be hard-coded file lists needing new entries. Both DISCOVER their files
        from the directory, so the new files were already covered. Nothing to do,
        recorded because the brief says otherwise.
    - id: rate-limit
      verdict: complies
      evidence: |
        No new route. The only Redis call added anywhere in the diff is
        InvalidateMembershipCache in CloseAllSpaceSeats -- cache invalidation, not
        a counter. The D4 lease is a CAS on a table column.
    - id: trust-boundary
      verdict: complies
      evidence: |
        agent_uids bounded by MemberBatchMax before the transaction. The six agent
        ineligibility reasons still collapse to one code -- and the round-3 fix
        narrowed what that code echoes to the ineligible subset, which is strictly
        less than it echoed before.
    - id: testing
      verdict: complies-with-note
      evidence: |
        Seven pre-existing test files are touched and every edit is additive
        registration into a hard-coded enumeration -- the shape the brief itself
        requires ("否则两个守卫静默缩水"). No existing assertion was weakened or
        removed. The two added in this phase are listed below.
    - id: commit-style
      verdict: complies

  # Gaps the Verify pass found and closed.
  fixed_in_verify:
    - id: audit-guard-did-not-enumerate-the-agent-seat-write
      where: modules/project/observability_test.go
      what: |
        The brief lists registering the create-with-agents path in
        TestEveryWritePathEmitsAnAuditEntry as load-bearing. Round 3 added the
        audit entries and covered them in a NEW case, which leaves the
        enumeration guard passing on the paths it already knew about -- exactly
        the silent shrink the brief names.
      fix: "that case now creates its project with agent_uids and asserts the agent seat is audited."
    - id: actor-seat-guard-stopped-at-the-requireSpaceSeatsTx-callers
      where: modules/project/review4_actorseat_test.go
      what: |
        createProject takes its space_member locks directly (lockSpaceSeatRowTx
        for the creator, lockSpaceSeatRowsTx for the agents) instead of through
        requireSpaceSeatsTx, so a guard scoped to that function's callers could
        not see the path the brief names as load-bearing.
      fix: "a seventh leg drives createProject with agent_uids under a seatless actor; the guard's scope is now every write that takes a space_member lock."
    - id: hook-ordering-was-asserted-nowhere
      where: modules/project/all_member_group_test.go
      what: |
        The brief asks for a case pinning that the provisioner runs only after the
        project transaction commits. Nothing checked it.
      fix: |
        The stand-in provisioner now reads octo_project on a POOLED connection --
        visible only if the create transaction committed -- and stubAllMemberGroup
        registers a cleanup that fails the case if it ever was not. Every stubbed
        case carries the check rather than one dedicated case carrying it.
    - id: d9-daily-quota-bypass-was-untested
      where: modules/project/all_member_group_e2e_test.go
      fix: |
        TestAllMemberGroupDoesNotConsumeTheDailyGroupQuota sets
        Group.SameDayCreateMaxCount to ZERO (so it cannot pass by the cap being
        generous) and asserts the all-member group is still built. It holds
        because the cap lives in the HTTP handler and the provisioner enters at
        the service layer; a refactor pushing the cap down would break it, which
        is the point.

  # Delivered differently from the brief, on purpose.
  declared_deviations:
    - id: i4-scan-b-does-not-exempt-banned-spaces
      brief_line: "扫描 B 的豁免：... 被封禁 Space 的项目"
      what_was_done: "the exemption was not implemented; the other two (grace window, system bots) are, plus removing = 1."
      why: |
        P1's I2 scan needs it because CheckMembershipForCleanup deliberately leaves
        a banned Space's seats alone, so the group rows are EXPECTED to remain --
        that is the ⊆ direction. Scan B is the ⊇ direction and the state it would
        suppress cannot arise: in a banned Space the cascade leaves BOTH sides
        alone, so seat and group row are either both present or both closing (and
        `removing = 1` already exempts the latter). Every other path that could
        strip a group row without touching the seat is now refused by D7. The
        exemption would be a `space` lookup per examined row that can never fire.
        A genuine admitter failure inside a banned Space stays reportable, which
        is the behaviour worth having.
    - id: p2-scan-bounds-guard-is-its-own-file
      brief_line: "纳入 TestReconcileQueriesAreBounded / TestReconcilePageQueriesExamineBoundedRows"
      what_was_done: "reconcile_p2_bounds_test.go re-applies both rules to reconcile_p2.go."
      why: |
        Those two guards read reconcile.go by name. P1 hit the same wall and
        answered it the same way (reconcile_p1_bounds_test.go), so this follows the
        precedent rather than widening the P0 guards and loosening them for
        everyone. The P2 file declares its own two exemptions next to their
        arguments.

