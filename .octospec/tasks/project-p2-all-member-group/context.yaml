# PR #855 fourth pass (yujiawei on head 1142ad5). Spec came back green; three new
# blocking findings, two of which this project put there in the round before.
pr_855_round_3_fixed:
  - id: writeback-was-not-fenced-on-the-lease-it-claimed
    severity: blocking
    where: modules/project/db_all_member_group.go setAllMemberGroupNo
    what: |
      Round 2 fenced releaseAllMemberGroupProvision on the claimed deadline.
      setAllMemberGroupNo never got the other half: its only guard was "the
      pointer is still empty".
    why_that_was_wrong: |
      The comment argued exactly one ordering -- the successor writes back first,
      so the late one finds a non-empty pointer and loses -- and that ordering is
      self-consistent. The reverse was not considered: A claims, runs past its
      lease, B claims and builds from the CURRENT roster, then A returns FIRST and
      writes back. The pointer is still empty, so A wins with its older snapshot.
    consequence: |
      The project names the group built from the stale roster; everyone added in
      the window is missing from it, and B group -- which has the complete roster
      -- survives as an ordinary project group, so the Space shows two groups
      named after the project. Lease expiry is not exotic here: the constant own
      comment sizes 2 minutes against the IM channel call as "the only part that
      can take minutes".
    fix: "the claimed deadline is threaded into the writeback as an equality fence. Correct in both directions: an expired-but-UNCLAIMED lease still holds the claimant own deadline, so a late write with no successor still lands."
    test: |
      all_member_group_lease_test.go -- the lease PROTOCOL, not the rebuild
      inputs. Two properties: exactly one group ever carries the pointer, and the
      one that does is built from the later roster. Confirmed non-vacuous by
      removing the fence and watching the stale write win.
    note: |
      The review asked for exactly this test and named why the previous round
      invariant test did not catch it: that one exercises the rebuild INPUTS,
      while what was unguarded is the protocol AROUND it -- which of two
      concurrent attempts becomes authoritative.
  - id: roster-truncation-became-silent
    severity: blocking
    where: modules/project/service_all_member_group.go / db_all_member_group.go
    what: |
      queryActiveMemberUIDsForRebuild was called with LIMIT = maxMembers while the
      caller checked len(roster) > maxMembers, so the check was unreachable.
    why_that_was_wrong: |
      Round 2 relaxed >= to > in response to a nit (>= also fires on a project
      legitimately at exactly max_members) and did not change the limit. The
      correct answer to that nit is to fetch maxMembers + 1 and keep >. So the
      round that was fixing a false-positive removed the only true signal, in a
      commit whose own heading reads "the roster is NOT truncated, this is a
      decision" -- while the code truncated anyway, at a bound updateProject can
      lower below the current seat count with no check.
    fix: "fetch maxMembers + 1, keep >, drop the probe row before seeding."
    test: TestRebuildWarnsWhenTheRosterIsTruncated
  - id: bot-deletion-continued-past-a-failed-seat-close
    severity: blocking
    where: modules/botfather/command.go onDeleteConfirm
    what: |
      CloseAllSpaceSeats returning an error was logged and the flow continued to
      deleteRobot. The comment justified that with two claims, and the review
      showed both are false.
    why_those_claims_were_false: |
      "I1 will report it" -- I1 looks for an active project seat whose SPACE seat
      is gone. In this failure the Space seat is still ACTIVE (the UPDATE never
      ran, or rolled back). No scan in this repository looks for an active
      space_member row whose robot row is status = 0.
      "Retrying the whole delete is idempotent" -- deleteRobot sets
      robot.status = 0, and the bot selection query requires status = 1, so the
      owner can never reach that bot again.
    consequence: |
      A bot the user deleted keeps an active Space seat in the failed Space,
      therefore an active project seat, therefore keeps satisfying the I2 gate and
      stays a reading member of that project groups -- permanently, invisible to
      every scan, with no user-reachable repair. Exactly the end state D14 exists
      to eliminate, and LESS observable than the raw UPDATE it replaced (that one,
      when it succeeded, left a state I1 could see).
    fix: "abort before deleteRobot and reply MsgDeleteFailedRetry. The robot row is still status = 1 at that point, so the retry the message promises actually works."
  - id: scan-b-double-reported-scan-a-problem
    brief_ref: Q2
    what: |
      Scan B base population required only that the pointer be non-empty. A
      project pointing at a DISBANDED group is therefore in it -- and group_member
      rows survive a disband (only group.status flips; the member cleanup is an
      async event that can fail), so the join keeps finding them until that
      cleanup lands and then finds none of them at once. Scan A already reports
      that project as one row.
    note: "The scan own doc comment claimed this exclusion. It only covered the empty-pointer case."
    fix: "exemption 5, in the violating flag with scan A join shape, so the two agree on usable."
    test: TestI4ScanBDoesNotDoubleReportScanAsProblem
  - id: assorted
    fixes: |
      Q5: the owner-candidate cap was a self-chosen 16 with nothing bounding a
      project to 16 owners; if the sixteen most senior were all I1 leaks the
      rebuild failed forever -- a narrow version of the P1 fixed last round. Now
      bounded by max_members, which is the meaningful bound (owners are a subset
      of members).
      Q6: bot_api guard copy read group.project_id itself, so a Space-direct group
      paid one query where C1 budgets zero. project_id now rides along with the
      status the handler already reads for its disband check.
      Q7: reasonAdmitRaceLost renamed admit_skipped_no_group -- the arm cannot
      tell a lost race from a failed provision, so a name that says "race" reads
      as a concurrency signal while double-counting provisioning failures.
      Q4: agent eligibility now includes the account itself
      (u.status = 1 AND COALESCE(u.is_destroy, 0) <> 2), matching the contact
      directory that D2 says it matches. Read as a separate flag rather than
      filtered in the WHERE, so a deactivated bot does not fall through to the
      HUMAN branch -- which is the shape of the hole closed two rounds ago.
      Nits: the D7 header said "four operations" while five are guarded; the brief
      D7 paragraph now names blacklist and the bot_api copy, and records that
      IsAllMemberGroup real signature is narrower than D5 wrote.
      Two stale spec-record entries corrected: declared_deviations still said the
      banned-Space exemption was not implemented, and open_verification still
      asked the deploy team to budget for TWO indexes after one was dropped. The
      second was a live instruction to whoever runs the migration.
  - id: transfer-not-disband-is-the-fail-open-outlier
    brief_ref: Q1
    what: |
      The open_verification entry asking whether the D7 guard should fail CLOSED
      was aimed at DISBAND, following the third-round reviewer. The fourth round
      showed that aim is backwards.
    detail: |
      The fail-open argument is that the worst case leaves a state a scan reports.
      remove / exit / blacklist leave member-set gaps (scan B); disband leaves a
      project pointing at a disbanded group (scan A, then the stale-pointer clear
      and a rebuild). TRANSFER is the one where it does not hold: a group-side
      owner transfer that slips through leaves the all-member group creator on
      someone who need not be a project owner, and no scan checks that relation.
      D6 own comment already describes the resulting state -- a group owner nobody
      can change, since D7 then refuses them transfer, exit and disband.
    status: "re-aimed in open_verification, still a product call rather than decided here."

# PR #855 fifth pass. Two reviewers on the same head (yujiawei, and Jerry-Xin
# joining), converging independently on the same two blocking items.
pr_855_round_4_fixed:
  - id: collate-placement-made-the-probe-index-unusable-on-user-traffic
    severity: blocking
    where: pkg/project/all_member_group.go IsAllMemberGroup, and modules/project/db_all_member_group.go queryAllMemberGroupNo
    what: |
      The repo rule is "put the explicit COLLATE on the driving side's values so
      the driving table's indexes stay usable". That is true and it hides the
      cost: an explicit COLLATE has coercibility 0, so the COMPARISON is in that
      collation and the OTHER side must be converted per row -- its index cannot
      serve it. `group.group_no` is 0900_ai_ci in production; group_groupNo, its
      UNIQUE index, was unusable.
    measured: |
      Reproduced locally on MySQL 8.0.46, `group` at 0900_ai_ci / 5000 rows:
        shipped join:  p const uk_octo_project_project_id 1 row
                       g ALL   possible_keys=group_groupNo  key=NULL  rows=5000
        split reads:   p const uk_octo_project_project_id 1 row
                       g const group_groupNo               1 row
    consequence: |
      IsAllMemberGroup is the WHOLE of the D7 guard, reached from six user-facing
      handlers (group disband / exit / member removal / owner transfer / blacklist,
      and the bot API member removal). A full scan of `group` -- a core IM table --
      on every group exit. In P0 and P1 this shape only touched background scans;
      P2 is the first time it reached request traffic.
    fix: |
      Both predicates split into two single-table reads with NO cross-schema
      comparison. Deliberately not "move the COLLATE to the legacy side": that is
      correct today and silently wrong in the mirror direction the moment the
      collation conversion lands. A comparison that crosses no schemas needs no
      collation opinion.
    not_fixed: |
      The two paged reconcile scans cannot be split that way. Their comment
      claiming a per-row index dive was corrected to state the measured plan
      (`g ALL`, plus `Using temporary` defeating the ORDER BY / LIMIT paging), and
      open_verification now carries that as the EXPLAIN item rather than an
      assumption. They inherit P0/P1's pending conversion and are bounded by
      ReconcileLimit and a 5-minute interval meanwhile.
    note: "CI creates its database with general_ci on both sides, so every one of these plans is const there. P0's migration header says exactly this -- a green suite is structurally not evidence."
  - id: the-one-query-optimisation-loosened-a-fail-closed-bot-guard
    severity: blocking
    where: modules/bot_api/send.go queryGroupStatusAndProject
    what: |
      Round 4's Q6 fix merged isGroupDisbanded's lookup with the D7 guard's
      project_id read, replacing LoadOne with Load. A missing group row therefore
      became (status 0, "", nil) -- "not disbanded" -- instead of dbr.ErrNotFound.
    consequence: |
      errBotSendPermGroupNotFound and the sendPermissionReasonNotFound metric,
      whose job is to separate "a bot is probing channel ids that do not exist"
      from "a query failed", became unreachable through the DB. On the OBO send
      path the disband guard was the ONLY existence check (checkOBO returns early
      with an enabled scope row). And modules/bot_api started answering
      differently from modules/robot and modules/message on the same question,
      while its own doc comment still claimed the not-found signal was preserved.
    why_the_suite_was_green: |
      Both "missing group" cases drive groupStatusQueryOverride -- the stub seam,
      which the change did not touch. The changed branch had no test at all.
    fix: "the not-found signal is wrapped and propagated; the D7 half short-circuits on projectID == \"\" independently. Two tests drive the REAL query with no stub."
    self_assessment: "This was mine, introduced to save one query for a P2 latency nit, on a PR labelled security-sensitive. The reviewer's framing is the right one."
  - id: admission-subscribed-the-parent-channel-but-not-its-threads
    severity: blocking
    where: modules/group/all_member_group.go admitToAllMemberGroup
    what: |
      Each thread is its own WuKongIM channel with its own subscriber list, and
      send permission is checked against that list. Every other admission path in
      the module pairs IMAddSubscriber with addUsersToGroupThreads -- memberAdd,
      groupScanJoin, un-blacklist, Service.AddGroupMembers, event.go -- and removal
      is symmetric. The all-member admitter had only the first half.
    consequence: "a member added to a project could not post in the all-member group's threads and did not receive them: permanently (the admitter runs once per join) and invisibly (I4 scan B reads group_member rows, not subscriptions)."
    fix: "addUsersToGroupThreads after the parent subscribe, held by a source guard on the pairing -- the effect itself is not assertable, since nothing here can read the broker's subscriber table back."
  - id: two-fixes-shipped-without-anything-pinning-them
    severity: blocking-adjacent
    raised_as: "Jerry-Xin P2-5, by mutation testing"
    what: |
      Reverting round 4's botfather abort to log-and-continue left the entire
      modules/botfather suite GREEN. Removing the +1 probe row from the roster
      query left TestRebuildWarnsWhenTheRosterIsTruncated GREEN -- a test named
      for the warning, asserting only the bound, which is identical either way.
    why_it_matters: "both are fixes the previous two rounds BLOCKED on, one revert away from returning with nothing going red."
    fix: |
      A closeSeatsFn seam in botfather plus two cases (abort on failure with the
      robot row still selectable; proceed on success). And the truncation is now a
      COUNTER, not only a log line -- a signal that exists only in a log cannot be
      asserted, which is how it got deleted silently once already.
    both_verified: "by re-running the reviewer's mutations: each test goes red."
  - id: comments-naming-detection-that-does-not-cover-the-residue
    raised_as: "Jerry-Xin P2-2"
    fixes: |
      CloseAllSpaceSeats's partial-failure comment said "I1 will report it". I1's
      domain is octo_project_member ("project seat alive, Space seat gone"); this
      residue is the opposite and no scan looks for it. The comment now says so and
      names the real backstop -- botfather aborting the deletion.
      The provisioning !ok Warn named only one of its three cases and routed the
      on-call reader to scan A for all of them; it now names all three (pointer
      taken, lease taken with the pointer still empty, project disbanded -- the
      last being I3's domain, not A's).
  - id: spec-record-and-journal-drift
    raised_as: "Jerry-Xin P2-1 / P2-3 / P2-4"
    fixes: |
      db.go's comment called octo_project_member a legacy table while the two lines
      above it say it is pinned -- and the consequence is worse than a wrong word:
      that pre-existing join raises 1267 under the production shape, so listMembers
      (D16's roster surface) cannot execute at all until the conversion lands. Added
      to open_verification as a gating item rather than left in a comment.
      The brief said "four protected operations" in four more places after the D7
      section was corrected to five, and still described D5 as "add an index" after
      the second one was dropped. The journal still described scan B as not
      exempting banned Spaces and counted end-to-end cases that have since grown.
      All corrected; the journal also gained the two lessons this round produced.

# octospec Verify phase. Each injected rule re-read and checked against the diff,
# then the brief's Acceptance walked line by line.
# PR #855 fifth pass, second half. The two blocking items were fixed in 07207f1;
# this is the non-blocking remainder from the same two reviews, worked rather than
# carried -- three of them had been restated across rounds, which is how an item
# becomes invisible by having been mentioned.
pr_855_round_5_fixed:
  - id: the-owner-sync-could-not-converge-two-creators
    severity: high
    where: modules/group/all_member_group.go ensureAllMemberGroupOwner
    what: |
      The creator rows were read without ORDER BY and only creators[0] was
      inspected. Two role=creator rows is the state the FOR UPDATE exists to
      prevent, so it is reachable -- and if the row the engine happened to return
      first was still an active project owner, the function returned at its first
      check with both creators intact.
    why: |
      Nothing else converges it: D7 refuses transfer, exit and disband on an
      all-member group, so no group-face path can clean up a second creator. The
      unordered read had a second cost -- which row counted as "the sitting
      creator" depended on the storage engine, so the outcome was untestable and
      could differ on a replica.
    fix: |
      Ordered by (created_at, uid), the same total order PickActiveOwner uses; the
      keeper is decided first and EVERY other creator row is demoted. The successor
      being already one of the creator rows is its own branch: promoting a row that
      is already a creator updates nothing, and the promote path treats that as a
      bug and rolls back, so the naive convergence would have turned a repairable
      state into a permanent error.
    test: TestOwnerSyncConvergesAGroupWithTwoCreators, TestOwnerSyncKeepsTheOwnerWhoIsAlreadyACreator
    mutation: "restoring the early return leaves the first test red."
  - id: the-owner-sync-asked-the-project-on-a-pooled-connection
    severity: medium
    where: modules/group/all_member_group.go, pkg/project/{membership,all_member_group}.go
    what: |
      MemberRole and PickActiveOwner ran on ctx.DB() while the sync held FOR UPDATE
      locks on the group's group_member rows -- a different snapshot from the one
      its writes land in.
    why: |
      The role can change inside that window, and this sync only re-fires on a
      project owner change, so a wrong answer is not retried until the next one.
      Deferred for three rounds on the belief that it needed new *dbr.Tx variants
      of two shared helpers.
    fix: |
      It did not. Widening both helpers to dbr.SessionRunner -- the repo's existing
      idiom (modules/group/bot_ownership.go, modules/user/db_manager.go) -- takes
      *dbr.Session and *dbr.Tx alike and changes no call site.
    test: TestOwnerSyncAsksTheProjectInsideItsOwnTransaction
  - id: the-last-index-served-no-query-either
    severity: medium
    where: modules/project/sql/20260907000002_project_all_member_group.sql
    what: |
      idx_octo_project_all_member_group (status, all_member_group_no) was justified
      by scan A's predicate. The third round moved all_member_group_no out of that
      WHERE and into the violating flag, so the justification stopped being true
      two rounds before this one.
    why: |
      Measured, neither scan chooses it under either collation shape: scan A pages
      by PRIMARY on p.id (a secondary index orders by all_member_group_no, not id),
      and scan B is driven from octo_project_member. The cost is a non-INSTANT
      online build plus a B+ tree on every octo_project write.
    fix: |
      Dropped, and the two ADD COLUMNs now say ALGORITHM=INSTANT so the file's own
      INSTANT claim is enforced rather than hoped for. The migration needs no
      deploy window at all now.
  - id: the-drift-test-could-not-see-a-plan
    severity: medium
    where: modules/project/all_member_group_plan_test.go
    what: |
      TestP2StatementsSurviveCollationDrift proves the statements EXECUTE under the
      production shape. That is the 1267 question. The fifth round's blocking item
      was a PLAN question, and no test could see it.
    fix: |
      A plan guard on the same drifted fixture, EXPLAINing the split predicates
      through constants the production code itself runs (a copy would pin the plan
      of a statement nobody executes). The removed joined form is the control: it
      MUST plan as a full scan of `group` under drift and must NOT after the
      conversion -- which is simultaneously the evidence for the split and the
      evidence that "move the COLLATE to the legacy side" is a fix with an expiry
      date.
    mutation: "putting a COLLATE back on the group-side read turns it red, naming the table."
  - id: the-account-deletion-entry-point-skipped-two-aftercare-steps
    severity: medium
    where: modules/space/member_removal_all_spaces.go CloseAllSpaceSeats
    what: |
      It cleared the per-uid authorization cache and kicked the worker, but did not
      invalidate notify's per-Space member cache and did not fire
      SpaceMemberRemove -- both of which afterMembersRemoved does on kick, leave
      and disband.
    why: |
      The event has zero listeners today, so nothing is broken now; that is exactly
      why it would have stayed broken. This function's own doc calls it the only
      correct entry point for "an account disappears entirely", and it was the one
      removal shape that would never reach a listener.
    fix: |
      Both helpers were extracted to package-level functions (one implementation,
      two entry points) and called from CloseAllSpaceSeats -- the event from a
      single goroutine, as afterMembersRemoved does, because listeners run on the
      caller's goroutine.
    test: TestCloseAllSpaceSeatsDoesTheSameAftercareAsEveryOtherRemoval
  - id: a-rename-could-resurrect-a-disbanded-group
    severity: medium
    where: modules/group/service.go UpdateGroupInfo, modules/group/db.go
    what: |
      UpdateGroupInfo read the group row on a pooled connection and wrote the whole
      snapshot back through DB.UpdateTx -- status, forbidden, invite, notice and
      creator included -- so anything committed inside that window was reverted.
    why: |
      Pre-existing, and the repo had already learned it twice (UpdateInviteTx and
      UpdateStatusTx both carry the comment). What is new is D8: before P2 the
      window opened when a person clicked rename; now every project rename drives
      it automatically, with no human in the loop.
    fix: "UpdateNameNoticeTx, a column-level write, used by UpdateGroupInfo. Fixes the HTTP rename path too."
    test: TestUpdateGroupInfoWritesColumnsNotTheWholeRow
  - id: the-create-path-half-of-account-usable-had-no-test
    severity: low
    where: modules/project/all_member_group_test.go
    what: |
      The deactivated / destroyed account cases were covered on members/add only.
      The two entry points run DIFFERENT queries (queryAgentRowsTx vs
      queryAgentClassTx), so "one of them is tested" was not coverage of the
      expression.
    fix: "Both cases added to the create-path refusal table, beside the four that were there."
    test: TestCreateProjectRejectsTheWholeRequestOnOneIneligibleAgent
  - id: comments-that-claimed-what-the-code-does-not-do
    severity: low
    what: |
      Four, each of which would have been cited by the next reader:
      (1) member_removal_all_spaces.go said a seat granted after the snapshot
      "会被 I1 对账扫描报出来" -- I1 is the opposite direction and no scan reports it;
      (2) the same file told callers to log and continue on a partial failure,
      which is the behaviour the fourth round REMOVED from its only caller;
      (3) admitToAllMemberGroup and renameAllMemberGroup called group.creator "this
      group's owner" -- it is the group's CREATOR, which no handover path in this
      repo rewrites, so it goes stale the moment the original creator leaves;
      (4) removeMemberOnce claimed a person, an unknown uid and a disabled bot all
      read alike, which stopped being true when account_usable was added -- removal
      deliberately does NOT ask it, so an owner can still reclaim the seat of an
      agent whose account is gone.
    fix: "All four corrected at the code, with the reason each was wrong."
  - id: the-synchronous-rebuild-had-no-stated-budget
    severity: low
    where: modules/project/service.go addMembers
    what: |
      The latency trade was argued for project creation. D15 widened members/add to
      canManageOwnAgents in the same PR, so an ordinary member adding their own
      agent can now trigger it, and no budget was written down.
    fix: |
      The budget is stated where the call is made: it has to fit the HTTP request,
      the 2-minute lease is a crash timeout and not an allowance, and if it stops
      fitting the answer is to move the rebuild to the reconcile worker rather than
      cap the roster (a capped rebuild is the defect the third round fixed).
      open_verification carries the measurement.

# PR #855 sixth pass. One reviewer (yujiawei) on 3db5f9c, two blocking findings,
# BOTH against the fifth round's own fixes -- one a behavioural regression the fix
# introduced, one a guard that passed with its subject deleted.
pr_855_round_6_fixed:
  - id: the-convergence-could-demote-the-only-valid-owner
    severity: blocking
    where: modules/group/all_member_group.go ensureAllMemberGroupOwner
    what: |
      The keeper was chosen before it was known whether the pool-picked successor
      could be promoted, and was never reconsidered when the promotion fell
      through. Reachable: creators = [S, B] where S is senior and no longer an
      owner and B IS an active project owner; PickActiveOwner returns A, the
      SENIOR owner, who is not in the group (the D12 gap scan B reports); the
      promotion finds no live member row; the keeper stays S; and the new
      convergence loop then demotes B.
    why: |
      Strictly worse than the state the convergence replaced. Before, this input
      wrote nothing and left {S, B} -- unconverged, but with a valid owner still in
      control. After, the group's only creator is a non-owner: D7 refuses transfer,
      exit and disband so no group-face path repairs it, the sync only re-fires on
      a project owner change, and NO scan asks whether a group's creator is a
      project owner. Two independent external events are needed to escape it.
    fix: |
      The keeper is chosen from "creators who are still active project owners"
      before falling back to creators[0], via firstActiveProjectOwner on the same
      transaction. Skipped entirely when PickActiveOwner returned "" -- that answer
      already means the project has no active owner at all, so no creator can be
      one either.
    test: TestOwnerSyncKeepsTheOwnerInTheGroupWhenTheSeniorOwnerIsMissing
    mutation: "reverting to keeping creators[0] leaves it red."
    note: |
      Neither round-5 test could see this: one had the senior creator BE the owner,
      the other had the picked owner already in creators. The arm that misbehaved
      was the only one with no case.
  - id: the-thread-guard-passed-with-its-subject-deleted
    severity: blocking
    where: modules/group/all_member_group_test.go
    what: |
      The guard matched the bare token addUsersToGroupThreads against the raw
      function source. The doc comment two lines above the call names the function,
      so deleting the CALL left the guard green -- the reviewer executed exactly
      that mutation and reported ok.
    why: |
      The fifth round asked for this fix to be pinned and this test was the pin
      offered. A guard whose subject also appears in the prose beside its subject
      is not a guard, and the absence being pinned had already shipped once
      undetected.
    fix: |
      Comments are stripped from the function body before searching, and both
      assertions now match CALLS (ctx.IMAddSubscriber( / g.addUsersToGroupThreads()
      rather than tokens. Over-stripping is the safe direction: removing text can
      only make an assertion harder to satisfy.
    mutation: "deleting the call now turns it red; verified with the reviewers exact mutation."
  - id: the-last-joined-write-path-statement
    severity: medium
    where: modules/project/db_all_member_group.go clearStaleAllMemberGroupPointer
    what: |
      The one statement on a write path still shaped as a JOIN UPDATE with COLLATE
      on the driving side, i.e. one full scan of `group` per call under the
      production collation shape.
    why: |
      Exposure is small but not zero and not once-only: a project with no active
      owner returns before provisioning, so every members/add on it pays the scan
      and buys nothing.
    fix: |
      Three single-table statements -- read the pointer, check the group row, then
      a clear fenced on the pointer value that was read. The fence is a guarantee
      the joined form did not have: a concurrently written new pointer is not
      cleared. Atomicity is not lost in any reachable way, because a group cannot
      go from unusable back to usable (disband is terminal, project_id is immutable
      by I3). The plan guard now covers this statement too.
  - id: a-rename-could-still-land-on-a-disbanded-group
    severity: medium
    where: modules/group/db.go UpdateNameNoticeTx
    what: |
      The column-level write closed the expensive half (a rename could no longer
      resurrect a disband) and left the other half: UpdateGroupInfo checks status on
      a pooled read, and the write carried no status predicate, so a rename landing
      after a concurrent disband still wrote the name, bumped the version and
      pushed an update notification for a group that is gone.
    why: "D8 drives this path machine-side on every project rename, so the window is no longer a human-click rarity."
    fix: "AND status <> disband in the WHERE. Zero rows affected is the whole effect; no error, no change to the caller's idempotence."
    test: "TestUpdateGroupInfoWritesColumnsNotTheWholeRow, now with both a disbanded case (nothing lands) and a live case (so the predicate cannot pass by refusing everything). The previous version of this test CODIFIED the residue -- it disbanded the group and expected the rename to succeed."
  - id: the-plan-guard-could-not-see-a-re-inlined-query
    severity: low
    where: modules/project/all_member_group_plan_test.go
    what: |
      The plan guard EXPLAINs statement constants. A constant stays referenced by
      the test itself, so re-inlining a joined query into IsAllMemberGroup while
      leaving the constant declared would regress production with every plan
      assertion still green.
    fix: "TestTheSplitPredicatesAreWhatProductionRuns requires each constant to appear at least twice in its own file -- declared AND used."

verify:
  rules_rechecked:
    - id: space-isolation
      verdict: complies
      evidence: |
        `go list -deps ./modules/project | grep -c modules/group` = 0. pkg/project
        imports no modules/* and does not read `robot`. Agent eligibility is
        decided inside the create transaction against space_member rows locked in
        the same statement position as the creator's (lockSpaceSeatRowsTx), never
        from the client's list. D13 matches agents on robot.creator_uid, the field
        the group side already uses. The new bot_api guard sits AFTER that
        handler's existing bot-ownership and group-admin checks.
    - id: error-handling
      verdict: complies
      evidence: |
        All four new codes are 4xx with Internal unset; every new response goes
        through httperr. make i18n-extract-check, make i18n-lint, golangci-lint on
        all six touched trees: clean. The bot_api refusal uses
        ResponseErrorLWithStatus, matching the three 403 refusals already in that
        same handler rather than diverging from D14.
      note: |
        The brief expected TestGroupNoLegacyResponseError / TestProjectNoLegacyResponseError
        to be hard-coded file lists needing new entries. Both DISCOVER their files
        from the directory, so the new files were already covered. Nothing to do,
        recorded because the brief says otherwise.
    - id: rate-limit
      verdict: complies
      evidence: |
        No new route. The only Redis call added anywhere in the diff is
        InvalidateMembershipCache in CloseAllSpaceSeats -- cache invalidation, not
        a counter. The D4 lease is a CAS on a table column.
    - id: trust-boundary
      verdict: complies
      evidence: |
        agent_uids bounded by MemberBatchMax before the transaction. The six agent
        ineligibility reasons still collapse to one code -- and the round-3 fix
        narrowed what that code echoes to the ineligible subset, which is strictly
        less than it echoed before.
    - id: testing
      verdict: complies-with-note
      evidence: |
        Seven pre-existing test files are touched and every edit is additive
        registration into a hard-coded enumeration -- the shape the brief itself
        requires ("否则两个守卫静默缩水"). No existing assertion was weakened or
        removed. The two added in this phase are listed below.
    - id: commit-style
      verdict: complies

  # Gaps the Verify pass found and closed.
  fixed_in_verify:
    - id: audit-guard-did-not-enumerate-the-agent-seat-write
      where: modules/project/observability_test.go
      what: |
        The brief lists registering the create-with-agents path in
        TestEveryWritePathEmitsAnAuditEntry as load-bearing. Round 3 added the
        audit entries and covered them in a NEW case, which leaves the
        enumeration guard passing on the paths it already knew about -- exactly
        the silent shrink the brief names.
      fix: "that case now creates its project with agent_uids and asserts the agent seat is audited."
    - id: actor-seat-guard-stopped-at-the-requireSpaceSeatsTx-callers
      where: modules/project/review4_actorseat_test.go
      what: |
        createProject takes its space_member locks directly (lockSpaceSeatRowTx
        for the creator, lockSpaceSeatRowsTx for the agents) instead of through
        requireSpaceSeatsTx, so a guard scoped to that function's callers could
        not see the path the brief names as load-bearing.
      fix: "a seventh leg drives createProject with agent_uids under a seatless actor; the guard's scope is now every write that takes a space_member lock."
    - id: hook-ordering-was-asserted-nowhere
      where: modules/project/all_member_group_test.go
      what: |
        The brief asks for a case pinning that the provisioner runs only after the
        project transaction commits. Nothing checked it.
      fix: |
        The stand-in provisioner now reads octo_project on a POOLED connection --
        visible only if the create transaction committed -- and stubAllMemberGroup
        registers a cleanup that fails the case if it ever was not. Every stubbed
        case carries the check rather than one dedicated case carrying it.
    - id: d9-daily-quota-bypass-was-untested
      where: modules/project/all_member_group_e2e_test.go
      fix: |
        TestAllMemberGroupDoesNotConsumeTheDailyGroupQuota sets
        Group.SameDayCreateMaxCount to ZERO (so it cannot pass by the cap being
        generous) and asserts the all-member group is still built. It holds
        because the cap lives in the HTTP handler and the provisioner enters at
        the service layer; a refactor pushing the cap down would break it, which
        is the point.

  # Delivered differently from the brief, on purpose.
  declared_deviations:
    # SUPERSEDED by pr_855_round_2_fixed / i4-scan-b-banned-space-exemption: the
    # exemption IS implemented now. Kept rather than deleted so the reasoning that
    # was wrong stays visible, but marked here because declared_deviations is what
    # a merger reads to decide what was skipped on purpose.
    - id: i4-scan-b-does-not-exempt-banned-spaces-SUPERSEDED
      brief_line: "扫描 B 的豁免：... 被封禁 Space 的项目"
      what_was_done: "the exemption was not implemented; the other two (grace window, system bots) are, plus removing = 1."
      why: |
        P1's I2 scan needs it because CheckMembershipForCleanup deliberately leaves
        a banned Space's seats alone, so the group rows are EXPECTED to remain --
        that is the ⊆ direction. Scan B is the ⊇ direction and the state it would
        suppress cannot arise: in a banned Space the cascade leaves BOTH sides
        alone, so seat and group row are either both present or both closing (and
        `removing = 1` already exempts the latter). Every other path that could
        strip a group row without touching the seat is now refused by D7. The
        exemption would be a `space` lookup per examined row that can never fire.
        A genuine admitter failure inside a banned Space stays reportable, which
        is the behaviour worth having.
    - id: p2-scan-bounds-guard-is-its-own-file
      brief_line: "纳入 TestReconcileQueriesAreBounded / TestReconcilePageQueriesExamineBoundedRows"
      what_was_done: "reconcile_p2_bounds_test.go re-applies both rules to reconcile_p2.go."
      why: |
        Those two guards read reconcile.go by name. P1 hit the same wall and
        answered it the same way (reconcile_p1_bounds_test.go), so this follows the
        precedent rather than widening the P0 guards and loosening them for
        everyone. The P2 file declares its own two exemptions next to their
        arguments.

# Cannot be verified from here; must be checked before merge.
open_verification:
  - "The three items in the brief's 'must check before merge' section: the client
     blast radius of member_count counting humans only (D16), whether the agent
     picker already excludes self-hosted agents (D2), and whether any caller
     depends on the synchronicity of botfather's old raw space_member update (D14)."
  - "EXPLAIN for the two I4 scans on production-scale `group` / `group_member`,
     under the PRODUCTION collation shape rather than CI's.
     PR #855's fifth review measured the shape this item was written about and it
     is worse than assumed: an explicit COLLATE has coercibility 0, so the
     comparison lands in general_ci and the legacy side's index cannot serve it.
     Measured on MySQL 8.0.46 with `group` at 0900_ai_ci / 5000 rows, the scan-A
     join plans as `g ALL key=NULL` plus `Using temporary` on the driving side,
     which defeats the ORDER BY / LIMIT paging as well as the per-row cost.
     The two USER-FACING predicates were fixed rather than measured --
     pkg/project.IsAllMemberGroup and queryAllMemberGroupNo are now two
     single-table reads with no cross-schema comparison, verified const/const --
     because a full scan of `group` on every group exit is not a background cost.
     The paged scans cannot be split that way and inherit P0/P1's pending
     conversion; they are what this item is now about.
     Scan A drives from octo_project by id with a point lookup per row, and scan B
     from octo_project with the (p.id, pm.uid) row-constructor cursor -- the same
     shape P1 flagged as needing a real plan for queryI2Page, and for the same
     reason the plan cannot be produced from CI.
     Measured again while fixing the fifth round, on a purpose-built database in
     the production shape (2000 projects x 10 members, 5000 groups): scan A is
     `p range PRIMARY` + `g ALL key=NULL` (hash join); scan B is not driven from
     octo_project at all -- `pm ref idx_octo_project_member_removing` then eq_ref
     back into p -- with `gm ALL` and `g ALL`, and `Using temporary; Using
     filesort` for the two-table keyset ORDER BY. Both scans stay bounded by
     ReconcileLimit and the 5-minute interval rather than by an index, which is
     what makes this an item to verify at production scale rather than a blocker.
     CI can now see the CLASS of defect even though it cannot see the scale:
     TestTheD7PredicateReachesItsRowByAnIndexUnderCollationDrift EXPLAINs the
     split predicates against a deliberately drifted database, with the removed
     joined form as a control that must plan as a full scan under drift and must
     not after the conversion."
  - "RESOLVED, by removal. This entry used to ask for the index build time at
     production row counts. There is no index left to build: the last one
     (idx_octo_project_all_member_group) was dropped in the fifth review round
     after EXPLAIN showed neither scan chooses it under EITHER collation shape --
     scan A pages by PRIMARY on p.id, and scan B is not even driven from
     octo_project. The migration is now two ADD COLUMNs, both pinned
     ALGORITHM=INSTANT so a silent downgrade to a rebuild fails loudly instead of
     becoming an unplanned long statement. Nothing in this migration needs a
     deploy window."
  - "RESOLVED. A WuKongIM broker (the pinned v2.2.4-20260313, WK_TOKENAUTHON=false)
     was installed alongside MySQL 8.0.46 and Redis, and every suite was re-run.
     modules/project (including -race -shuffle=on), group, space, thread, message,
     bot_api and integration are GREEN. Two failures remain and both are
     pre-existing, verified against a stashed clean tree: botfather's
     TestRegisterStoresAgentHosting and channel's TestGetStoryline_NotGroupMember.
     modules/user has an order-dependent failure in its VerifyPasswordByUID family
     that appears on the clean tree too and passes when that family is run alone;
     nothing in this change touches modules/user."
  - "That the all-member group's IM channel subscriber list equals its member set.
     modules/group creates the channel inside CreateGroup and rolls the group back
     if it fails, and the end-to-end cases exercise that path, but nothing in this
     repository can READ a channel's subscribers back from WuKongIM -- there is no
     such call anywhere in octo-server or octo-lib -- so the equality itself is not
     assertable from a test. Same class as the EXPLAIN items above: check it
     against a running broker before merge."
  - "Whether the D7 guard should fail CLOSED on TRANSFER specifically, while
     staying fail-open on the other four actions.
     This entry first asked the question about DISBAND, following mochashanyao,
     and the fourth review round showed that aim was backwards. The fail-open
     argument is that the worst case leaves a state a scan reports: remove / exit
     / blacklist leave member-set gaps (scan B), and disband leaves a project
     pointing at a disbanded group (scan A, then clearStaleAllMemberGroupPointer
     and a rebuild). Transfer is the one where it does not hold -- a group-side
     owner transfer that slips through leaves the all-member group creator on
     someone who need not be a project owner, and NO scan checks that relation.
     D6 own comment names the resulting state: a group owner nobody can change,
     because D7 then refuses them transfer, exit and disband. The only automatic
     repair is the next project-side owner event.
     Still not decided here: it is a product call about which failure a user is
     walked into, and splitting the guard by action costs the property that all
     five answer identically. But it should be asked about transfer."
  - "The synchronous rebuild's latency at a full roster. ensureAllMemberGroup runs
     inside the HTTP request on POST /v1/projects/:id/members/add, and D15 widened
     that handler to canManageOwnAgents -- so an ORDINARY member adding their own
     agent can trigger it. Worst case it reads up to max_members + 1 seats, calls
     pkg/space.ActiveMembers once over them, then CreateGroup inserts up to
     max_members member rows with one Redis GenSeq each plus one blocking IM call.
     At the default cap of 500 that is a few hundred Redis round-trips; it has not
     been measured. Bounded meanwhile by the fact that it is reachable only for a
     project whose provisioning already failed and by the lease, which serialises
     concurrent triggers. If it does not fit the request budget the answer is to
     move the rebuild onto the reconcile worker, NOT to cap the roster -- a capped
     rebuild is the incomplete-group defect the third round fixed.
     PR #855's fifth review, Q3."
  - "GATING: modules/project listMembers cannot execute under the production
     collation shape at all -- its pre-existing `LEFT JOIN user u ON u.uid = pm.uid`
     compares 0900_ai_ci (`user`) with pinned general_ci (octo_project_member) and
     raises 1267. This is P0's join and rides the pending conversion, not this
     change; it is listed here because it is D16's roster surface and becomes
     user-visible the moment the feature switch flips. Either the conversion lands
     or that join is pinned BEFORE project groups are enabled for real traffic.
     PR #855's fifth review verified the 1267 by execution."
