  - "Whether the D7 guard should fail CLOSED on TRANSFER specifically, while
     staying fail-open on the other four actions.
     This entry first asked the question about DISBAND, following mochashanyao,
     and the fourth review round showed that aim was backwards. The fail-open
     argument is that the worst case leaves a state a scan reports: remove / exit
     / blacklist leave member-set gaps (scan B), and disband leaves a project
     pointing at a disbanded group (scan A, then clearStaleAllMemberGroupPointer
     and a rebuild). Transfer is the one where it does not hold -- a group-side
     owner transfer that slips through leaves the all-member group creator on
     someone who need not be a project owner, and NO scan checks that relation.
     D6 own comment names the resulting state: a group owner nobody can change,
     because D7 then refuses them transfer, exit and disband. The only automatic
     repair is the next project-side owner event.
     Still not decided here: it is a product call about which failure a user is
     walked into, and splitting the guard by action costs the property that all
     five answer identically. But it should be asked about transfer."
  - "The synchronous rebuild's latency at a full roster. ensureAllMemberGroup runs
     inside the HTTP request on POST /v1/projects/:id/members/add, and D15 widened
     that handler to canManageOwnAgents -- so an ORDINARY member adding their own
     agent can trigger it. Worst case it reads up to max_members + 1 seats, calls
     pkg/space.ActiveMembers once over them, then CreateGroup inserts up to
     max_members member rows with one Redis GenSeq each plus one blocking IM call.
     At the default cap of 500 that is a few hundred Redis round-trips.
     MEASURED in round 10, after mochashanyao raised the same point as a P2:
     TestRebuildAtAFullRosterStaysInsideAnHTTPBudget seeds a 500-member roster, puts
     the project back into \"provisioning never succeeded\", and times the request that
     pays for the rebuild end to end -- 500 members admitted in 130ms on MySQL
     8.0.46 + Redis + WuKongIM v2.2.4-20260313, all on one box. That is a FLOOR, not
     a production figure (no network between the three, an empty database, no
     concurrent load), so what remains open is the same number against production
     latencies; the order of magnitude it settles is milliseconds, not seconds.
     Bounded meanwhile by the fact that it is reachable only for a project whose
     provisioning already failed and by the lease, which serialises concurrent
     triggers. If it does not fit the request budget the answer is to move the
     rebuild onto the reconcile worker, NOT to cap the roster -- a capped rebuild is
     the incomplete-group defect the third round fixed.
     PR #855's fifth review Q3, measured after its tenth."
