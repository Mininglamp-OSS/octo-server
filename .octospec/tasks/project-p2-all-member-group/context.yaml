# Round 10 landed TWO independent reviews on head 221f383 within eight minutes:
# yujiawei (2 blocking + 5 P2) and mochashanyao / Octo-Q (1 blocking + 1 P2).
# They agree on the blocking one; everything else is disjoint.
pr_855_round_10_fixed:
  - id: a-third-bot-deletion-entry-point-was-outside-d14
    severity: high
    reported_by: "yujiawei P1-1 and mochashanyao P1 (independently, same finding)"
    where: modules/robot/api_manager.go, modules/space/bot_deletion_census_test.go, modules/robot/api_manager_delete_seatclose_test.go
    what: |
      Manager.robotDelete (DELETE /v1/manager/robots/:robot_id, super-admin) removed
      the bot from every group and flipped robot.status to 0 without touching
      space_member and without writing a removal ticket. The residue is a DIFFERENT
      shape from the bare UPDATE the previous two rounds fixed, and worse: the Space
      seat stays active, so the project seat stays active, while the bot is already
      out of the all-member group. That is exactly I4 scan B's violating state, it is
      exempt from none of the five exemptions, and scan B is report-only. D13 cannot
      reclaim the seat (it requires robot.status = 1) and an operator cannot repair
      it by re-adding, because addOneMemberOnce refuses a disabled robot row.
      The methodological error is mine and is the point: the round-7 census asked
      "who WRITES space_member", which structurally cannot find a door that deletes
      a bot WITHOUT writing it. The right question is "what deletes a bot".
    fix: |
      robotDelete routes through space.CloseAllSpaceSeats with
      MemberRemoveReasonBotDeleted, behind the same injectable closeSeatsFn seam
      botfather's two doors have, aborting the deletion on failure (robot.status
      stays 1, so the admin can retry). The operator is the acting super-admin, not
      the bot -- the attribution bug the command door already fixed once.
    test: |
      Two layers. Endpoint-level, matching the two doors that already had one:
      TestManagerBotDeleteClosesSeatsThroughTheOutbox (a cleanup job per closed
      seat), TestManagerBotDeleteAttributesTheRemovalToTheAdmin,
      TestManagerBotDeleteAbortsWhenSeatsCannotBeClosed.
      Set-level, which is what the review actually asked for:
      TestEveryBotDeletionEntryPointRoutesThroughD14 in modules/space. It parses the
      tree (go/ast, no comment text in the AST at all), finds every function that
      turns a bot's robot row off, finds every function that calls one, and requires
      each to call the D14 seam with the bot_deleted reason -- or to be recorded as
      an exemption with a written reason.
    found_by_the_census: |
      A FOURTH call site nobody had named: botfather/command.go tryCreateBotCore
      calls deleteRobot to compensate a half-failed CREATION. Correctly exempt (the
      bot never got a Space seat), and recorded as such. It is also the argument for
      why the set-level test was needed: an endpoint-level test could not have
      surfaced it.
    mutation: "deleting the closeSeatsFn call turns all three endpoint tests AND the census red."
  - id: the-space-removal-path-never-converged-the-all-member-groups-owner
    severity: high
    reported_by: "yujiawei P1-2"
    where: modules/space/member_removal.go, modules/project/{space_member_removal,service_all_member_group,db,api}.go
    what: |
      A project owner can lose their seat four ways: kicked, left, role changed, and
      removed from the Space. The first three call syncAllMemberGroupOwner. The
      fourth did not -- and on that path the group side still hands the group over,
      picking the second-oldest non-bot GROUP member with no project-role filter. It
      can land on an ordinary project member, whom D7 then forbids from
      transferring, exiting, disbanding or blacklisting the group. Nobody can move
      it and no scan reports it: I4 compares member SETS, never creator-versus-owner.
    fix: |
      A post-steps FINALIZER registry in modules/space, and modules/project
      registers the idempotent owner sync into it.
      Not a fifth step and not a call inside deactivateSeatForCascade: step order is
      registration order, which is import order, declared nowhere -- and BOTH orders
      leave the defect. Group step first: the departing owner's project seat is still
      active, so PickActiveOwner can return the person on their way out, promoting
      them fails (they are no longer a group member), and the non-owner stays.
      Project step first: the group still has the departing owner as creator, so the
      sync changes nothing and the handover installs the non-owner afterwards.
      A finalizer runs only after every step SUCCEEDED, so its input is a settled
      state rather than an ordering artifact. Its failure retries the job.
    test: |
      TestSpaceRemovalLeavesTheAllMemberGroupOwnedByAProjectOwner (e2e, real group
      module) plus four registry-contract cases in modules/space:
      TestFinalizerRunsAfterEveryStep (records the ORDER, which is what a fifth step
      could not give), TestFinalizerDoesNotRunWhenAStepFailed,
      TestFailedFinalizerRetriesTheJob, TestFinalizerPanicIsContained.
    a-test-that-was-asserting-a-coin-flip: |
      The first version of the e2e case passed with the fix removed.
      group_member.created_at is second-granular, both adds land in the same second,
      and querySecondOldestNonBotMemberTx orders by created_at with NO tie-break --
      so the successor was whichever row the engine returned first, which happened to
      be the right answer. Bob's group row is now backdated an hour, which makes the
      seniority pick deterministic and the mutation red.
    mutation: "unregistering the finalizer turns the e2e case red."
  - id: both-i4-scans-shipped-on-by-default-with-a-measured-full-scan-plan
    severity: medium
    reported_by: "yujiawei P2-1 (the one point both reviewer legs agreed on)"
    where: modules/project/{reconcile,reconcile_p2,review8_reconcile_gate_test}.go
    what: |
      The two I4 scans ran outside ReconcileEnabled on the argument that the gate is
      for statements that cannot survive the collation drift, and these can. True,
      and the wrong question: SURVIVING 1267 is not the same as being affordable.
      Their own measured plans under the production shape are `g ALL key=NULL` plus
      `Using temporary` for scan A and `Using temporary; Using filesort` for scan B,
      and the temporary table takes the ORDER BY / LIMIT paging with it -- so
      ReconcileLimit stops bounding the work. On by default is a five-minute full
      scan of a core IM table on every pod for as long as the conversion is unscheduled.
    fix: |
      Both scans moved inside ReconcileEnabled, with the reason stated as cost rather
      than failure so the next reader does not "fix" it back. Both are report-only, so
      what waiting costs is the reporting -- and the gate's startup Warn now names all
      five gated scans, which is what makes "we never turned it on" findable.
    test: TestReconcileGateCoversExactlyTheGatedScans (renamed; the gated set is now five, and the reason differs per half)
  - id: two-hooks-judged-group-attribution-from-a-stale-snapshot
    severity: medium
    reported_by: "yujiawei P2-3"
    where: modules/group/{all_member_group,db,service}.go, modules/project/{all_member_group_registry,service_all_member_group}.go
    what: |
      admitToAllMemberGroup re-reads the group row in its own transaction so the
      admission gate judges attribution from an authoritative snapshot (Q13). The
      other two hooks did not: renameAllMemberGroup checked only status and then
      updated by group_no, and ensureAllMemberGroupOwner read group_member by
      group_no and never asked about attribution at all. The project side's
      queryAllMemberGroupNo does verify both halves, but it is a separate unlocked
      read -- a detach landing in that window lets a project rename, or change the
      creator of, a group that is no longer its own.
    fix: |
      ensureAllMemberGroupOwner gets the same in-transaction re-read admission has.
      The rename cannot: the transaction belongs to UpdateGroupInfo. It gets a FENCE
      instead -- project_id in the UPDATE's own WHERE, threaded through
      UpdateGroupInfoServiceReq.ExpectProjectID -- which is strictly stronger, since
      read and write are one statement and there is no window to narrow. Zero rows
      exits through the existing errGroupGoneOrDisbanded path, i.e. a quiet skip.
      The rename hook's signature gained projectID to carry it.
    test: TestOwnerSyncRefusesAGroupThatIsNoLongerTheProjects, TestOwnerSyncStillActsOnTheProjectsOwnGroup, TestRenameRefusesAGroupThatIsNoLongerTheProjects, TestRenameFenceIsWhatStopsTheWrite
    mutation: "removing the re-read, the early return, or the fence each turns its own case red."
  - id: the-list-routes-two-counts-do-not-share-a-read-view
    severity: low
    reported_by: "yujiawei P2-4"
    where: modules/project/db.go
    what: |
      AgentCount's comment said the two counts come from one snapshot of the roster
      so the difference cannot go negative, and fillMemberCounts' repeated it. They
      are two statements with no enclosing transaction: SeatCount from the page
      query's correlated subquery, MemberCount from a later statement. A concurrent
      add between them makes MemberCount > SeatCount in normal operation -- so the
      clamp is load-bearing, and the comment read as if it were decorative.
    fix: |
      Comments rewritten to say what the code does, including what the clamp does NOT
      buy (member_count + agent_count == seat_count can be off by one, briefly).
      Folding the classification back into the page statement was rejected on the
      spot: it means re-adding the COLLATE'd join into `user` at one join per listed
      project, which is exactly what round 8 removed.
  - id: comment-drift-in-two-places
    severity: low
    reported_by: "yujiawei P2-5"
    where: pkg/errcode/group.go, modules/project/reconcile_p2.go
    fix: |
      errcode's D7 code said it refuses "the four group operations" and omitted
      blacklist, in the one place a client author reads to find out what the code
      means; it now says five and names it. reconcile_p2 labelled the grace-window
      predicate "exemption 3: a banned Space" -- wrong exemption AND wrong line; the
      grace window is 3, the ban is 4, and both now sit on their own predicate.
  - id: the-full-roster-rebuild-was-carried-as-unmeasured
    severity: low
    reported_by: "mochashanyao P2"
    where: modules/project/all_member_group_e2e_test.go
    what: |
      ensureAllMemberGroup runs synchronously inside the HTTP request, and D15
      widened the caller set from canManageMembers to canManageOwnAgents -- so an
      ordinary member adding their own agent can trigger it. The worst case (a CAS
      claim, a max_members+1 roster read, a batched Space read, CreateGroup inserting
      ~500 rows with a Redis GenSeq each plus one blocking IM call, then a
      write-back) was carried in open_verification as never measured.
    fix: |
      Measured instead of gated. TestRebuildAtAFullRosterStaysInsideAnHTTPBudget
      seeds a 500-member roster, puts the project back into "provisioning never
      succeeded", and times the request that pays for the rebuild end to end.
      Local (MySQL 8.0.46 + Redis + WuKongIM v2.2.4-20260313, all on one box):
      500 members admitted in 130ms. That is a floor, not a production number, but it
      answers the question that was open -- the order of magnitude is milliseconds,
      not seconds. The ceiling asserted is 60s, deliberately loose: a tight bound on
      a shared runner is a flake generator, and what the assertion has to catch is
      the difference between "fast" and "the client times out".
    not_done: |
      The alternative the review offered -- gate the synchronous rebuild to
      canManageMembers callers -- was NOT taken. It trades a measured 130ms for a
      project that stays without a group until someone with higher privilege happens
      to write, and every admission in between is skipped with reasonAdmitSkippedNoGroup.

# PR #855 merged as 566e625. The eleventh review APPROVED it and recorded three P2s plus a
# nit and a coverage gap, explicitly as owned fast-follows. This section is that follow-up,
# on a fresh branch off the merged main.
pr_855_round_11_fixed:
  - id: the-census-guard-did-not-have-the-property-its-commit-claimed
    severity: medium
    reported_by: "yujiawei P2-1 (executed, with two mutations)"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The round-10 commit message said "a fourth door added tomorrow fails this test the
      moment it is written". Not true, in two spellings.
      (a) The HARD delete was invisible: the matcher knew `UPDATE robot SET status=0` and
      `.Update("robot")` and nothing else, so a `DeleteFrom("robot")` door passed. The
      reviewer proved it by adding one. Worse, that spelling is already in the tree --
      deleteCreatedBotArtifacts uses it (modules/botfather/db.go:239) and registers as a
      primitive only via the raw UPDATE in its fail-closed fallback. It passed the
      anti-vacuity list for the WRONG REASON, which is precisely why that list could not
      expose the blind spot.
      (b) The two halves can live in different functions: updateRobotInfo holds the
      `.Update("robot")` with no literal, a caller holds `{"status": 0}` with no Update.
      Neither half is a primitive and the caller is not a door.
    fix: |
      Hard delete recognised in both spellings (`DeleteFrom("robot")` and raw
      `DELETE FROM robot`). The split spelling is resolved one hop: functions that write
      the robot table with a caller-supplied field map are collected first, and a function
      holding a literal `"status": 0` that calls one becomes a DOOR.
      Not an exemption entry: recording updateRobotInfo as exempt would have said its
      callers may skip D14, which is false.
    a-fix-that-failed-its-own-mutation-first: |
      The first attempt classified the split-spelling function as a PRIMITIVE. Primitives
      are skipped by the "a primitive is not a door onto itself" rule, and nothing called
      it, so nothing was asserted and the mutation stayed green. The classification is
      load-bearing: in that shape the deletion site IS the function holding the literal,
      because the Update it borrows lives in a generic helper that is not itself a
      deletion. Caught only by running the mutation.
    mutation: |
      Both of the reviewer's probes now turn it red: a DeleteFrom("robot") door, and a
      caller passing {"status": 0} to updateRobotInfo. Baseline still green, still finding
      3 primitives and 4 doors.
  - id: the-finalizers-retry-could-not-make-progress
    severity: medium
    reported_by: "yujiawei P2-3"
    where: modules/project/space_member_removal.go, modules/project/metrics_all_member_group.go
    what: |
      convergeAllMemberGroupOwners returned errCascadeIncomplete on a spent page budget,
      with a comment claiming parity with the cascade's retryable error. The claim is false
      in exactly the half that makes retry useful: the cascade re-queries ACTIVE seats, so
      the rows it closes leave its own result set and each retry starts smaller. This query
      deliberately has no status filter (with one it returns the empty set and converges
      nothing), so a retry re-reads from project_id > '' and walks the same first 5000 rows
      forever -- until the job burns its attempt budget and is marked abandoned, dragging
      every already-successful cleanup step through twenty pointless re-runs.
      Reachable rather than theoretical: octo_project_member rows are never deleted
      (rejoining is an UPDATE) and the per-Space quota counts only ACTIVE projects, so the
      historical row count for one (space_id, uid) is unbounded.
    fix: |
      A spent budget no longer asks for a retry: it counts a new metric reason
      counter of its own (project_all_member_group_owner_convergence_incomplete_total, NOT a
      kind on the sync-failure counter -- see the entry below for why that was rejected), logs
      the resume cursor, and returns nil. What is given up is
      stated in the code: the projects past the budget are not converged this time, and
      wait for their own next kick / leave / role change -- all three of which already call
      the same sync. Persisting the cursor would need a column on
      space_member_removal_cleanup, which belongs to modules/space; inverting that layering
      for a project-side finalizer is its own task.
    test: TestOwnerConvergenceDoesNotAskForARetryItCannotWin, plus TestOwnerConvergenceStillWalksEveryPageWithinBudget as the control
    mutation: "putting errCascadeIncomplete back turns the first case red."
  - id: the-attribution-re-read-narrowed-the-window-without-closing-it
    severity: medium
    reported_by: "yujiawei P2-2"
    resolution: "documented, not closed -- the suggested fix introduces a deadlock"
    where: modules/group/all_member_group.go
    what: |
      The round-10 fix re-read the group row in-transaction, but non-locking. That read is
      the transaction's first, so it OPENS the read view: a detach committing after it is
      invisible, the group_member locks taken next do not revalidate the group row, and the
      sync goes on to promote or demote creators in a group that is now Space-direct.
      The review is right about all of that, and right that the comment declining FOR SHARE
      cited the wrong subject (that argument is about the octo_project_member role read).
    what-i-did-and-why-not-the-suggested-fix: |
      Took FOR SHARE, ran the suites, then this branch's own code review found the reason it
      cannot stay: it introduces an ABBA deadlock that did not exist before.
      P1's cascade, handOverProjectGroupIfCreator (project_cascade.go:282), locks
      group_member FOR UPDATE first (queryGroupCreatorTx) and then, on the no-successor
      path, takes an exclusive lock on the SAME group row (detachGroupFromProjectTx) --
      group_member then group. The owner sync with FOR SHARE is group then group_member.
      Both reach the same all-member group: the cascade's detach branch needs "no group
      member is still in the project", which a one-person project satisfies exactly when its
      owner leaves. Concurrent, that is ABBA and MySQL kills one side with 1213.
      Reverted to the non-locking read, with the window, its consequence and its prerequisite
      written into the code instead of waved at.
    the-real-ordering-defect-is-one-file-over: |
      The declared lock order is
      space_member -> space -> project -> group -> group_member -> octo_project_member.
      handOverProjectGroupIfCreator takes group_member before group, which INVERTS it. That
      inversion is what makes the correct fix here unsafe. Straightening it is its own change
      on a load-bearing P1 path and needs its own analysis and cases; recorded as a follow-up
      rather than ridden along on a fast-follow.
    what-the-remaining-window-costs: |
      A detach has to commit inside the gap between this transaction's first read and its
      group_member writes. The end state is a Space-direct group with a possibly-wrong
      creator -- and being Space-direct it is no longer under D7, so an ordinary owner
      transfer repairs it. Materially different from the unrepairable state round 10 fixed.
  - id: the-one-new-statement-shipped-without-its-plan
    severity: low
    reported_by: "yujiawei, the nit"
    where: modules/project/db.go
    fix: |
      queryProjectIDsForSpaceMemberPage now carries its measured plan, like every other new
      statement in this change. MySQL 8.0.46, 10k rows over 200 uids x 50 Spaces, after
      ANALYZE: `ref idx_octo_project_member_space_uid key_len=324 ref=const,const rows=50`,
      `Using where; Using filesort`. The index seeks to the (space_id, uid) range, which is
      the part that must be right; the filesort is expected, because the index is
      (space_id, uid, status) and constraining status is exactly what this query must not
      do. Bounded by the set: one row per project the member was ever in.
  - id: the-gate-tests-name-outgrew-its-coverage
    severity: low
    reported_by: "yujiawei, the coverage note"
    where: modules/project/review8_reconcile_gate_test.go
    what: |
      runReconcile now runs ten scans, five gated and five not. The list of ungated scans in
      the test still named two, so i2, i3 and removing_stall were asserted nowhere -- an
      edit that accidentally gated one would pass a test whose name claims it covers exactly
      the gated set. i2 is the one that matters: a violation there is a person seeing a
      project group they are not in. The file header also read "two of the five ... the
      other five", which is seven against an actual ten.
    fix: "all five ungated scans asserted; header arithmetic corrected."
    mutation: "gating scanI2Violations now turns it red; before this it did not."
  - id: the-census-still-skipped-a-handler-that-deletes-inline
    severity: medium
    reported_by: "self, /code-review on this branch"
    where: modules/space/bot_deletion_census_test.go
    what: |
      Teaching the matcher the hard-delete spelling created a third instance of the same
      bug it was fixing. A handler that runs `DeleteFrom("robot")` INLINE is classified a
      primitive, and "a primitive is not a door onto itself" then excludes it from the door
      set -- so step 3 never checks it for D14 routing. That rule silently assumes every
      primitive is a db-layer helper with a handler above it, which is true of all three
      today and false for an inline one.
    fix: |
      A primitive nothing calls is its own door. Stated as a rule rather than left to the
      assumption, since this is now the third time the same assumption produced a hole.
    mutation: "a handler with an inline DeleteFrom(\"robot\") and no seam now turns it red."
  - id: the-budget-spent-signal-was-filed-as-a-failure
    severity: low
    reported_by: "self, /code-review on this branch"
    where: modules/project/metrics_all_member_group.go
    what: |
      owner_budget_spent was added as a `kind` on all_member_group_sync_failures_total,
      whose Help says it counts failed sync attempts. It is not a failure: the projects
      reached were converged. Any alert summing that counter across kinds would page on a
      normal event -- and telling that it was normal would require already knowing this kind
      exists, which defeats the alert.
    fix: |
      its own counter, all_member_group_owner_convergence_incomplete_total.
      Scope, added in round 3: this was caught in the working tree BEFORE the first commit on
      this branch -- `git log -S owner_budget_spent --all -- modules/project` is empty, so no
      commit anywhere ever carried that kind. Recording it is right; describing it as a defect
      the PR repaired in shipped code is not, and the PR description said exactly that.
  - id: one-metric-shipped-under-a-different-namespace-from-its-six-siblings
    severity: low
    reported_by: "self, while checking a merge-impact list"
    where: pkg/project/all_member_group.go
    what: |
      AllMemberGroupGuardFailures registered under namespace `octo_project` -- named after
      the table prefix rather than the module -- while the feature's other six metrics use
      `project`, and every other module in the repo uses one namespace per module (`group`,
      `dmwork`). It is the single metric an operator most needs, because D7 fails open and
      this counter is the only thing separating a database hiccup from the guard having been
      off since Tuesday. Under a different prefix it would not appear beside its siblings on
      a dashboard, and a merge-impact list written from the sibling names had it wrong.
    fix: |
      Renamed to `project_all_member_group_guard_failures_total`. Done now because the
      feature is off by default and no dashboard exists yet; later it is a breaking rename.

# D16 的计数口径在 GA 前改回来了。不是 review 提的，是核实"是否 breaking"时查出来的。
pr_855_member_count_realigned:
  - id: one-server-two-meanings-of-member_count
    severity: medium
    reported_by: "self, while answering whether the D16 semantic change was breaking"
    where: modules/project/{model,api,db}.go
    what: |
      D16 redefined Resp.member_count as "humans only" and added agent_count. Checking the
      client blast radius turned up two facts that together change the question:
        1. Not breaking -- but for a reason checkable from the tags, not the one first
           recorded here. v1.18.0 (2026-09-07) DOES ship modules/project (42 files),
           including Resp.member_count filled from countActiveMembers, i.e. the TOTAL.
           What never shipped is the humans-only redefinition: `git tag --contains`
           puts 566e625 on no release. So this restores the released meaning and retires
           the unreleased one, and a v1.18.0 client sees no change at all.
           The original wording ("has never been GA, nothing has shipped") was wrong and
           was the weaker argument; PR #868's fifth review checked the tags.
           group / thread / integration each have
           their own member_count on their own endpoints; none was touched.
        2. But modules/opanalytics already ships member_count (total),
           human_member_count and agent_member_count on the wire, to the same client
           teams. So the server now means two different things by one field name, and
           `agent_count` is separately taken by the Space directory, where it means "how
           many agents this OWNER has".
      Nothing catches that: both spellings compile, both return an int, and a client author
      who learned the opanalytics convention renders the wrong number in projects.
    fix: |
      member_count restored to EVERY active seat -- its pre-D16 meaning and opanalytics'
      meaning -- with the split moved to human_member_count and agent_member_count, named
      for the existing precedent rather than the shorter agent_count.
      D16's original argument survives intact: a project with one person and two of their
      agents should not render "3 人". That is a statement about what the client DISPLAYS,
      and the display fix is for it to read human_member_count. Redefining member_count
      bought the same outcome and charged one namespace collision for it.
      toResp derives member_count as humans + agents rather than reading a third count:
      both callers already produce the two halves from two statements, so a separately-read
      total could disagree with them, and the identity a client renders
      (member_count == human + agent) now holds by construction.
      listRow.MemberCount renamed HumanCount for the same reason -- two structs one
      function-argument apart holding a same-named field of opposite meaning is how the
      wrong one gets passed.
    test: |
      TestListRouteSplitsTheRosterAndTheThreeCountsAddUp -- new, and it covers the path that
      had none: the LIST route, where the two halves come from two statements. It asserts
      the three fields on a mixed roster, that they add up, and that the detail route agrees
      field-for-field. TestCreateProjectSeatsTheCreatorsAgents extended with the same three.
    mutation: "making member_count humans-only again turns both cases red."
    window: |
      Done while the humans-only meaning is still unreleased, which is the only time it is
      free -- see the tag check above; "before first GA" was the wrong way to say it, since
      v1.18.0 already ships the field with its total meaning. After the humans-only meaning
      reaches a tag, restoring member_count and renaming agent_count are two breaking
      changes rather than one field rename against unreleased main.

# PR #868 收到三份 review：两票 APPROVE，一票 CHANGES_REQUESTED（Octo-Q，1 个 P1）。
# 门禁状态最终是 approved，但那条 P1 成立，连同 yujiawei 的 P2-1/P2-2 是同一类，一并修。
pr_868_review_fixed:
  - id: the-census-drew-its-line-on-spelling-and-called-it-semantics
    severity: high
    reported_by: "mochashanyao P1; yujiawei P2-1 found the same class from another angle"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The one-hop rule keyed on a literal `"status": 0` in the CALLER, so it could not see
      either live endpoint that turns a bot off:
        updateRobotStatus  PUT /robot/status/{id}/{status}  robot.Status = int(status)
                           -> updateRobot -> UPDATE robot SET version=?, status=?
        robotUpdate        PUT /robots/{id}                 fields["status"] = *req.Status
                           -> updateRobotInfo
      updateRobot's write is BYTE-IDENTICAL to deleteRobotSoft's, which this file classifies
      as a deletion primitive whose doors must route through D14. The only difference is that
      one spells the zero as a literal. And the first door's zero is the DEFAULT for a
      malformed path parameter, so it is reachable by accident.
      Worse than the miss: my step-0 comment justified it -- "correct, it is a reversible
      disable, not a deletion". deleteRobotSoft is exactly as reversible. That was a semantic
      story told about a syntactic behaviour, and it would have taught the next reader that
      the gap was a decision.
      yujiawei's angle: the `.Set("status", 0)` chain (182 uses in the tree) was unmatched too,
      and such a function landed in the benign-helper set -- so the guard did not merely miss
      the door, it filed it under harmless and then used it to accuse that door's callers.
    fix: |
      The rule is now effect-based. A function that writes the robot table's status column
      with ANY value -- literal, variable, or a caller-supplied field map -- is STATUS-CAPABLE,
      and every caller of one is a door candidate. Both dbr spellings of a literal zero
      (SetMap entry and Set chain) now make a function a primitive.
      What happens to the two doors is a DECISION recorded in d14ExemptDoors with its residue
      spelled out, not an omission in a matcher: disable is not delete (reversible, releases no
      username, rotates no token), and round 11 already ruled that whether a disable should
      release the project seat is a PRODUCT question. Recording the exemption is the honest
      move; routing them through D14 would be answering that question myself.
    a-false-positive-the-widening-produced-and-what-it-taught: |
      The first widening flagged bot_api's applyAgentReport, because it hands SetMap a map it
      builds itself. "Not a literal" is not the same as "the caller's": a locally built map has
      knowable columns (all agent_*, never status), a parameter does not. Narrowed to
      `SetMap(p)` where p is one of the function's own parameters -- which also narrows what
      used to be flagged, so callers of setDescription / updateBotCommands /
      updateRobotIMTokenCache are no longer accused of being bot-deletion doors (yujiawei P2-6).
    mutation: |
      Five probes, each killing exactly one fixture: remove the Set-chain branch; remove the
      dbr hard-delete branch; remove the raw-SQL hard-delete branch; remove the SetMap-param
      branch; and widen SetMap back to "any non-literal" (the false-positive regression).
  - id: the-matchers-that-close-the-blind-spots-were-themselves-unguarded
    severity: medium
    reported_by: "yujiawei P2-2 -- the one he said he would fix before merge"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The census asserts an OUTCOME over the tree. It says nothing about whether each matcher
      branch can still SEE its shape. yujiawei verified by deletion: remove the hard-delete
      branch, or step 0, or the uncalled-primitive rule, and the suite stays green -- because
      nothing in the tree spells those shapes today. That is the same defect the PR was fixing
      (round 11: the census passed for the wrong reason), moved one abstraction level up.
    fix: |
      TestCensusMatcherSeesEverySpellingItClaimsTo -- ten fixtures parsed from source strings,
      one per matched shape plus three that must NOT match (status zero on another table, a
      locally built map, a table whose name merely starts with robot). Source strings rather
      than the repository, because a branch covering a shape the tree does not contain can only
      be exercised that way. The scanner was split into censusFuncsIn so both drivers share one
      classifier.
    note: |
      This is the exit criterion yujiawei proposes for the whole chain, and it is the right one:
      guards that assert their own detection paths, not just their outcomes.
  - id: four-comments-and-two-records-left-stale-by-this-work
    severity: low
    reported_by: "yujiawei P2-4/P2-5, mochashanyao P2 x2"
    fix: |
      - db_agent.go: the identity read "member_count + agent_count == seats", i.e. after #868
        "seats + agents == seats", naming a field that no longer exists. Now stated as
        human_member_count + agent_member_count == member_count. The eighth review had already
        corrected this same comment once.
      - roster_counts_test.go: justified itself on the list route being "the only path where the
        two numbers come from TWO statements". PR-5 moved seat_count into fillMemberCounts, so
        both come from one roster read -- which this PR's own db.go and api.go comments say. Two
        comments in one PR stating opposite facts about one function. Re-argued on what is
        actually true: the two routes compute their halves in DIFFERENT CODE and must agree.
      - reconcile.go: said the ungated pair "touch only this module's own tables", the narrower
        of the two reasons -- and giving the narrow one is how the gate test's header ended up
        asserting a smaller set than the code had.
      - context.yaml: recorded the budget-spent event as "a new metric reason
        (owner_budget_spent)" while the code ships a dedicated counter, with the same block
        recording that the kind was REJECTED. An operator writing an alert from it would have
        queried a series that does not exist.
      - project-p2-product-surfaces/brief.md: still recorded member_count as humans-only, and
        that paragraph is explicitly earmarked as the source for the not-yet-written Swagger
        contract -- so leaving it would have written the retired semantics into the contract at
        the moment it was created.
  - id: the-pr-description-claimed-coverage-that-was-not-committed
    severity: low
    reported_by: "both reviewers, independently"
    what: |
      The Testing section said the census guard "executes against both of the reviewer's own
      probes and against an inline-deletion door". Those were throwaway mutations I ran, not
      committed fixtures. Overstating coverage in the description of a PR whose subject is a
      guard that passed for the wrong reason.
    fix: "description corrected, and the fixtures now actually exist (entry above)."

pr_868_round_3_fixed:
  - id: the-exemptions-were-config-that-nothing-checked
    severity: high
    reported_by: "yujiawei (review 5149568590, the APPROVE); mochashanyao reproduced the same mutation independently"
    where: modules/space/bot_deletion_census_test.go
    what: |
      Round 2 made the census EFFECT-based and recorded updateRobotStatus / robotUpdate in
      d14ExemptDoors. Both reviewers then deleted the status-capable door loop and the whole
      suite stayed green: the door set drops from 6 to 4 and those two endpoints simply leave
      the census. Nothing noticed, because neither is reachable through a primitive, and the
      known-door anti-vacuity list names only the three that are.
      So the entire mechanism round 2 added was deletable while green, and the exemption
      entries -- which read like assertions -- were config that nothing consumed. An exemption
      nothing checks is indistinguishable from a matcher that was deleted.
    fix: |
      Every key in d14ExemptDoors must appear in the door set the census actually found; a
      recorded exemption for a door the matcher can no longer see is now an error, with the
      two readings (renamed/removed vs matcher regressed) named in the message. Plus the
      matching anti-vacuity loop on statusCapableWriters for updateRobot / updateRobotInfo,
      since those two are what make the endpoints visible in the first place.
    mutation: |
      deleting the status-capable door loop now reddens TWO cases -- the exemption-consumption
      assertion in the census, and the assembly fixture below. Verified.
  - id: the-classifier-was-fixtured-but-the-assembly-was-not
    severity: high
    reported_by: "yujiawei P?; mochashanyao, same round"
    where: modules/space/bot_deletion_census_test.go
    what: |
      Round 2's answer to "a branch with no example quietly stops working" was fixtures for
      censusFuncsIn -- the CLASSIFIER. The door ASSEMBLY was still driven only by whatever the
      repository happens to contain, and both branches there have the same property: delete the
      uncalled-primitive rule and the door set is byte-identical, because all three real
      primitives have callers today.
      That is the third recurrence of one defect at a third level: the census (round 11), the
      classifier branches (round 1), the assembly (round 2).
    fix: |
      assembleCensus extracted from the test body and driven by synthetic packages in
      TestCensusDoorAssemblyIsPinned -- four cases: a caller of a status-capable writer is a
      door; a primitive nothing calls is its own door; a primitive WITH a caller makes the
      caller the door and not itself; a writer that never touches status leaves its callers
      alone.
    mutation: "deleting the uncalled-primitive rule now reddens the inline-handler case. Verified."
  - id: the-Set-chain-branch-still-had-no-fixture-of-its-own
    severity: medium
    reported_by: "yujiawei, same round"
    where: modules/space/bot_deletion_census_test.go
    what: |
      Round 2 added `cf.writesStatusColumn = true` on the `.Set("status", ...)` chain, but the
      only chain fixture wrote a literal zero -- which setsStatusZero already covers. Deleting
      the writesStatusColumn line left the fixture passing, so the status-capable half of that
      branch was untested.
    fix: 'a `.Set("status", v)` fixture with a VARIABLE, asserted wantStatusCapable.'
    mutation: "deleting that line now reddens exactly that case. Verified."
  - id: the-fixture-header-claimed-a-precision-it-did-not-have
    severity: low
    reported_by: "self, while mutation-verifying the three above"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The header said "deleting any single detection branch turns exactly one case below red".
      Measured across all nine branches: true for eight, false for the ninth. The
      `Update("robot")` table guard reddens five, because it is not a spelling but the
      precondition every robot-table shape is built on.
    fix: |
      Header now states the measurement instead of the slogan, including the exception. The
      property that matters -- no branch is deletable while green -- is stated separately and
      is what was actually verified.
  - id: the-description-listed-a-defect-that-never-shipped
    severity: low
    reported_by: "self, checking the description against git history"
    where: PR #868 description; this file, the-budget-spent-signal-was-filed-as-a-failure
    what: |
      The Changes list said "`owner_budget_spent` was filed as a `kind` on the sync-FAILURE
      counter ... It has its own counter", which reads as a defect this PR repaired in shipped
      code. `git log -S owner_budget_spent --all -- modules/project` is empty: no commit ever
      carried that kind. It existed only in this branch's working tree, and /code-review
      caught it before the first commit.
      Small, but it is the second description-overstatement in one PR, in a PR whose subject is
