pr_868_round_3_advisory_taken:
  - id: the-justification-said-expensive-about-a-ten-line-reorder
    severity: medium
    reported_by: "yujiawei P2-1 (both of that review's advisory passes reached it independently)"
    where: modules/group/all_member_group.go
    what: |
      The comment explaining why FOR SHARE was reverted said the window can only be closed
      after the cascade's lock order is straightened, i.e. that closing it is a cross-module
      change to a P1 path. The ABBA analysis behind the revert is right; the conclusion drawn
      from it is not. Verified the reviewer's alternative against the code: the txGroup read is
      used only for validation (nil / disbanded / reassigned), and nothing between it and the
      creator lock depends on its result. Moving it AFTER the `group_member ... FOR UPDATE` and
      making it locking gives this function the order group_member -> group -- the cascade's own
      order, so no ABBA, and the two paths then serialize on group_member so the detach cannot
      land in the window. Cost: one extra lock in the already-detached case, which early-returns.
      A justification that says "expensive" about a ten-line local reorder tells the next reader
      not to look. That is the same failure as the round-2 comment that called a matcher gap
      correct on semantic grounds.
    fix: |
      The comment now says the window CAN be closed locally, describes the reorder, and gives
      the real reason for not doing it here: it changes lock acquisition on a P1-adjacent path
      and deserves its own concurrency test, which is scheduling, not difficulty. The cascade's
      own inversion is named as a separate matter and explicitly NOT a precondition.
    not_changed: "the reorder itself. The reviewer asked for the justification, not the fix."
  - id: the-spent-budget-comment-described-the-disposition-not-the-residue
    severity: medium
    reported_by: "yujiawei P2-2 (one of its advisory passes rated this P1)"
    where: modules/project/space_member_removal.go
    what: |
      The comment framed the give-up as deferral -- "those projects wait for their own next
      membership change". What it left out is what the intermediate state IS. All three of the
      reviewer's claims check out against the code:
        - querySuccessorForProjectGroupTx (group/db.go) picks by seniority narrowed by I2, i.e.
          any ACTIVE project member, not an active project OWNER. That mismatch is the reason
          this finalizer exists at all.
        - a human cannot repair it: owner transfer is one of the six D7-guarded handlers, and
          the group is still project-bound, so IsAllMemberGroup is true and the guard applies.
        - nothing reports it: the five ungated scans are ownerless / epoch / I2 / I3 /
          removing_stall, none of which asserts D6 owner correctness.
      So the new counter is not a nicety, it is the only signal this state exists.
    fix: |
      The residue is now named as a D6 violation, with the three points above and the reason it
      is still P2 (reachability is 5000 rows -- 25 pages x 200 -- for one (space_id, uid), and the
      same projects were never converged under the old code either: `after` resets per invocation,
      so a retry re-walks all 25 pages and never advances past row 5000, so this is
      not a regression). The cursor-persistence follow-up now carries a D6 owner-correctness
      scan alongside it.
  - id: the-flat-name-space-was-visible-but-unstated
    severity: low
    reported_by: "yujiawei P2-4"
    where: modules/space/bot_deletion_census_test.go
    what: |
      primitives, statusCapableWriters and the f.calls[name] lookup are keyed by bare function
      name, repo-wide, while d14ExemptDoors is keyed "file:func" and says why. The asymmetry is
      deliberate -- an exemption must not be inherited by a same-named function elsewhere -- but
      only one half of it was written down.
    fix: "stated in Known limits, with which direction each half fails in (loudly, both)."
  - id: the-status-flags-are-per-function-not-per-statement
    severity: low
    reported_by: "yujiawei P2-5"
    where: modules/space/bot_deletion_census_test.go
    what: |
      writesStatusColumn / setsStatusZero are set from any `.Set` or key-value in the body,
      independent of which table the surrounding statement targets. A function that updates
      `robot` in one statement and writes `"status": 0` to another table in a second is
      classified as a deletion primitive. Round 2 widened the numerator, so the surface grew.
      Fail-closed: a false primitive is a false door and a loud failure.
    fix: |
      Pinned rather than narrowed -- a twelfth fixture asserting the current over-match, with
      the reason in place, so the day someone scopes the flags to a statement this case tells
      them the behaviour changed on purpose. Narrowing it means tracking dbr builder chains
      through locals, which is a different tool.
  - id: the-remeasured-header-changed-again
    severity: low
    reported_by: "self, after adding the twelfth fixture"
    where: modules/space/bot_deletion_census_test.go
    what: |
      The header's measurement was re-run after the over-match fixture landed and the numbers
      moved: seven of nine branches redden exactly one case, not eight. `Update("robot")`
      reddens six (was five) and the key-value `"status": 0` branch now reddens two, both
      because they are shapes several fixtures are built out of rather than spellings of their
      own.
    fix: "header re-measured and rewritten. The invariant claim -- none deletable while green -- is unchanged and still verified."

pr_868_round_3_superseded_review_items:
  - id: the-raw-sql-side-never-got-round-2s-widening
    severity: medium
    reported_by: "yujiawei P2-4 in the superseding review (5149568590); first-pass found it independently"
    where: modules/space/bot_deletion_census_test.go
    what: |
      Round 2 taught the dbr side to see a status write with any value (`.Set("status", v)`,
      `SetMap(param)`). The raw-SQL side was left matching only the literal zero, so
      `UpdateBySql("UPDATE robot SET status=? ...")` was neither a primitive nor status-capable.
      The reviewer enumerated every raw write to the table and confirmed no live miss today --
      which is precisely the condition this file exists to stop depending on.
    fix: |
      rawRobotSetClause captures the SET clause and rawStatusAssignment looks for the status
      column THERE. The capture is load-bearing, not cosmetic: two live statements write
      bound_agent_ref with status=1 in their WHERE, and a regex matching `status =` anywhere in
      the string would call both of them bot disables. Two fixtures: the bound status write
      (status-capable) and the WHERE-only guard (no match).
    mutation: |
      deleting the branch reddens the bound-status fixture; widening the match from the capture
      back to the whole string reddens the WHERE-only fixture. Both verified. Door and
      status-capable sets on the tree are unchanged, matching the reviewer's enumeration.
  - id: the-counter-help-read-as-a-guarantee
    severity: low
    reported_by: "yujiawei P2-3 in the superseding review"
    where: modules/project/metrics_all_member_group.go
    what: |
      The Help said the unvisited projects "are picked up by their own next membership change".
      That is a guarantee about an event that may never come, on a counter that -- per the same
      review's own finding -- is the only signal the state exists at all.
    fix: |
      Help now names the residue (a possible D6 violation D7 blocks repair of and no scan
      reports), states the convergence as conditional on one of that project's own members being
      removed / leaving / changing role, says this counter is the only signal, and points at
      resumeAfterProjectId on the accompanying warning as the manual resume point.
  - id: the-branch-sweep-moved-again
    severity: low
    reported_by: "self, after adding the raw-SQL branch"
    where: modules/space/bot_deletion_census_test.go
    what: "ten branches now, not nine; eight redden exactly one case, not seven."
    fix: |
      Header re-measured a third time this round. Also states why the SET-clause capture is
      mutated separately from the branch: deleting it and widening it are different failures,
      and only the second one reaches the live WHERE-clause shape.

verify:
  rules_rechecked:
    - id: space-isolation
      verdict: complies
      evidence: |
        `go list -deps ./modules/project | grep -c modules/group` = 0. pkg/project
        imports no modules/* and does not read `robot`. Agent eligibility is
        decided inside the create transaction against space_member rows locked in
        the same statement position as the creator's (lockSpaceSeatRowsTx), never
        from the client's list. D13 matches agents on robot.creator_uid, the field
        the group side already uses. The new bot_api guard sits AFTER that
        handler's existing bot-ownership and group-admin checks.
    - id: error-handling
      verdict: complies
      evidence: |
        All four new codes are 4xx with Internal unset; every new response goes
        through httperr. make i18n-extract-check, make i18n-lint, golangci-lint on
        all six touched trees: clean. The bot_api refusal uses
        ResponseErrorLWithStatus, matching the three 403 refusals already in that
        same handler rather than diverging from D14.
      note: |
        The brief expected TestGroupNoLegacyResponseError / TestProjectNoLegacyResponseError
        to be hard-coded file lists needing new entries. Both DISCOVER their files
        from the directory, so the new files were already covered. Nothing to do,
        recorded because the brief says otherwise.
    - id: rate-limit
      verdict: complies
      evidence: |
        No new route. The only Redis call added anywhere in the diff is
        InvalidateMembershipCache in CloseAllSpaceSeats -- cache invalidation, not
        a counter. The D4 lease is a CAS on a table column.
    - id: trust-boundary
      verdict: complies
      evidence: |
        agent_uids bounded by MemberBatchMax before the transaction. The six agent
        ineligibility reasons still collapse to one code -- and the round-3 fix
        narrowed what that code echoes to the ineligible subset, which is strictly
        less than it echoed before.
    - id: testing
      verdict: complies-with-note
      evidence: |
        Seven pre-existing test files are touched and every edit is additive
        registration into a hard-coded enumeration -- the shape the brief itself
        requires ("否则两个守卫静默缩水"). No existing assertion was weakened or
        removed. The two added in this phase are listed below.
    - id: commit-style
      verdict: complies

  # Gaps the Verify pass found and closed.
  fixed_in_verify:
    - id: audit-guard-did-not-enumerate-the-agent-seat-write
      where: modules/project/observability_test.go
      what: |
        The brief lists registering the create-with-agents path in
        TestEveryWritePathEmitsAnAuditEntry as load-bearing. Round 3 added the
        audit entries and covered them in a NEW case, which leaves the
        enumeration guard passing on the paths it already knew about -- exactly
        the silent shrink the brief names.
      fix: "that case now creates its project with agent_uids and asserts the agent seat is audited."
    - id: actor-seat-guard-stopped-at-the-requireSpaceSeatsTx-callers
      where: modules/project/review4_actorseat_test.go
      what: |
        createProject takes its space_member locks directly (lockSpaceSeatRowTx
        for the creator, lockSpaceSeatRowsTx for the agents) instead of through
        requireSpaceSeatsTx, so a guard scoped to that function's callers could
        not see the path the brief names as load-bearing.
      fix: "a seventh leg drives createProject with agent_uids under a seatless actor; the guard's scope is now every write that takes a space_member lock."
    - id: hook-ordering-was-asserted-nowhere
      where: modules/project/all_member_group_test.go
      what: |
        The brief asks for a case pinning that the provisioner runs only after the
        project transaction commits. Nothing checked it.
      fix: |
        The stand-in provisioner now reads octo_project on a POOLED connection --
        visible only if the create transaction committed -- and stubAllMemberGroup
        registers a cleanup that fails the case if it ever was not. Every stubbed
        case carries the check rather than one dedicated case carrying it.
    - id: d9-daily-quota-bypass-was-untested
      where: modules/project/all_member_group_e2e_test.go
      fix: |
        TestAllMemberGroupDoesNotConsumeTheDailyGroupQuota sets
        Group.SameDayCreateMaxCount to ZERO (so it cannot pass by the cap being
        generous) and asserts the all-member group is still built. It holds
        because the cap lives in the HTTP handler and the provisioner enters at
        the service layer; a refactor pushing the cap down would break it, which
        is the point.

  # Delivered differently from the brief, on purpose.
  declared_deviations:
    # SUPERSEDED by pr_855_round_2_fixed / i4-scan-b-banned-space-exemption: the
    # exemption IS implemented now. Kept rather than deleted so the reasoning that
    # was wrong stays visible, but marked here because declared_deviations is what
    # a merger reads to decide what was skipped on purpose.
    - id: i4-scan-b-does-not-exempt-banned-spaces-SUPERSEDED
      brief_line: "扫描 B 的豁免：... 被封禁 Space 的项目"
      what_was_done: "the exemption was not implemented; the other two (grace window, system bots) are, plus removing = 1."
      why: |
        P1's I2 scan needs it because CheckMembershipForCleanup deliberately leaves
        a banned Space's seats alone, so the group rows are EXPECTED to remain --
        that is the ⊆ direction. Scan B is the ⊇ direction and the state it would
        suppress cannot arise: in a banned Space the cascade leaves BOTH sides
        alone, so seat and group row are either both present or both closing (and
        `removing = 1` already exempts the latter). Every other path that could
        strip a group row without touching the seat is now refused by D7. The
        exemption would be a `space` lookup per examined row that can never fire.
        A genuine admitter failure inside a banned Space stays reportable, which
        is the behaviour worth having.
    - id: p2-scan-bounds-guard-is-its-own-file
      brief_line: "纳入 TestReconcileQueriesAreBounded / TestReconcilePageQueriesExamineBoundedRows"
      what_was_done: "reconcile_p2_bounds_test.go re-applies both rules to reconcile_p2.go."
      why: |
        Those two guards read reconcile.go by name. P1 hit the same wall and
        answered it the same way (reconcile_p1_bounds_test.go), so this follows the
        precedent rather than widening the P0 guards and loosening them for
        everyone. The P2 file declares its own two exemptions next to their
        arguments.

