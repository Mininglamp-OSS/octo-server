schema_version: 1
task: im-pending-outbox
brief: .octospec/tasks/im-pending-outbox/brief.md
resolved_at: 2026-08-23T05:00:00+00:00

injected_rules:
  - id: space-isolation
    source: repo
    load_bearing: true
    why: >
      This is the enforcement point of group membership at the transport layer, and the
      rule's fail-open warning is literally what was happening: a dropped unsubscribe left
      the removed member with full read AND write on the channel, measured rather than
      assumed. The fix is fail-closed in the sense that matters — a failure now persists as
      work rather than vanishing — while deliberately NOT turning a recoverable broker blip
      into a user-visible 500, since the isolation boundary converges via the worker.
  - id: testing
    source: repo
    load_bearing: true
    why: >
      The dangerous branch (IM call errors) cannot be produced against a real broker, so
      both packages grew a stub whose /channel/subscriber_remove can be toggled to 500.
      The wiring test at the real call site was mutation-verified: removing the
      in-transaction enqueue turns it red on exactly the assertion that names the bug.
      A second test asserting the blacklist path was written and then DELETED rather than
      shipped — it only exercised the enqueue API, not the handler, and a test that looks
      like coverage it does not provide is worse than an acknowledged gap.
  - id: error-handling
    source: repo
    load_bearing: true
    why: >
      Injected by path glob. One new error path returns from RemoveGroupMembers (enqueue
      failure aborts the removal rather than committing a delete whose unsubscribe can
      never be retried); it reuses the function's existing plain-error convention and adds
      no user-facing code. Everything else logs and continues. No pkg/errcode entry, no raw
      c.ResponseError / c.JSON. i18n-extract-check and i18n-lint pass unchanged.
  - id: rate-limit
    source: repo
    load_bearing: true
    why: Injected by path glob only. No route, middleware, or request-frequency counter touched.
  - id: commit-style
    source: repo
    load_bearing: false
    why: Conventional Commits, English subject line.

gates_run:
  - "ci/run-e2e-shard.sh 1 1 — full CI E2E lane, 44 packages (the script itself runs -race -shuffle=on)"
  - "golangci-lint run ./modules/space/... ./modules/group/... ./modules/botfather/... — 0 issues"
  - "make i18n-extract-check — pass"
  - "make i18n-lint — pass"

notes: >
  Environment prerequisites unchanged; see cleanup-membership-predicate/context.yaml.

  One process mistake worth recording: an E2E lane was launched in the background and then
  a `DROP DATABASE test` was run for an unrelated unit test while it was still going. The
  two fought over the same schema and produced two spurious package failures
  (`app_config doesn't exist`, `group already exists`) that looked like real regressions in
  modules/user. Never run anything that touches the test database while the lane is in
  flight — the lane owns it for its whole duration.
