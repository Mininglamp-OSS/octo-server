     counts (brief C4). ADD COLUMN ... NOT NULL DEFAULT '' is INSTANT on MySQL
     8.0; the index is a separate online INPLACE statement and its duration has
     to be measured, not asserted."
  - "EXPLAIN before/after for queryGroupsWithMemberUIDAndSpaceID and
     modules/bot_api/groups.go:51 — (space_id, project_id) is the first index to
     serve space_id, so these two query plans change (C4)."
  - "Whether the three org-directory event listeners are live in production
     (brief D7): P1 converges them and adds a metric rather than deleting them.
     Deleting becomes a separate change once production shows zero rows."

