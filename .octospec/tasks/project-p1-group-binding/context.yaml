# Deferred by the requester until #841 (P0) merges — do NOT act on these here.
deferred_until_p0_merges:
  - id: reconcile-switch-consolidation
    note: |
      Whether the reconcile job needs its own enable switch separate from
      OCTO_PROJECT_CREATE_ENABLED. The argument for two was that they guard
      different risks that do not overlap in time — CREATE_ENABLED guards "the
      feature is not ready" (a business risk, flipped repeatedly), a reconcile
      switch guards "the database collation is not unified yet" (an
      infrastructure risk, permanently on once converted) — and that sharing one
      switch blinds the I1 monitoring at exactly the moment someone kills writes
      to stop the bleeding, while the Space-side cascade keeps producing new
      violations.
      MEASURED AT e6a46cf (#841 head): no RECONCILE_ENABLED / ReconcileEnabled
      exists in the tree. The reconcile job is unconditional; only its interval
      and page limit are configurable (OCTO_PROJECT_RECONCILE_INTERVAL /
      _LIMIT). So there is nothing to consolidate at HEAD, and P1 adds no second
      switch of its own — its new scans ride the existing job.
      The requester's call: revisit after #841 merges. P1 does not touch it.

