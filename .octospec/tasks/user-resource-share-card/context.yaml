decisions:
  - A resource share mints a new server-owned representation; it never forwards
    an existing message or arbitrary type-17 payload.
  - Smart-summary and docs are independent provider onboarding increments over
    one generic platform path.
  - The generic user send endpoint and Bot dispatcher remain unchanged; only
    the resource-share service may transport a human-sender type-17 message.
  - Identical-intent retry reuses durable per-target results; same nonce with a
    changed signed fingerprint is a replay conflict.
  - Provider revalidation is required before dispatch to reject stale resource
    revisions and enforce recipient disclosure/grant policy.
  - Proofs use asymmetric keys and cross-language canonical vectors; provider
    and global flags default off until renderer verification is deployed.

