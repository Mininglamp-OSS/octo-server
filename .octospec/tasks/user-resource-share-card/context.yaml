# Rules resolved while refining the load-bearing implementation contract.
rules_injected:
  - id: error-handling
    tier: repo
    load_bearing: true
    why: >
      The new authenticated endpoint needs localized request-wide failures and
      stable, non-enumerating per-target outcomes. Production handlers must use
      httperr.ResponseErrorL and registered errcodes; raw non-OK JSON is not
      permitted.
  - id: rate-limit
    tier: repo
    load_bearing: true
    why: >
      SharedUIDRateLimiter applies after AuthMiddleware, while feature,
      provider, DM-peer, and channel budgets count canonical targets across
      replicas and fail closed on limiter-store errors.
  - id: space-isolation
    tier: repo
    load_bearing: true
    why: >
      Login Space, signed Space, active Space membership, and every target's
      authoritative Space must match exactly. Phase one rejects legacy-empty,
      external fallback, and cross-Space targets.
  - id: trust-boundary
    tier: repo
    load_bearing: true
    why: >
      Human-sender type-17 is a narrow exception. The client cannot submit a
      sender, card, URL, target alias, OBO field, mention, subscriber, or
      transport metadata; provider intent and platform proof use pinned keys and
      fail closed.
  - id: testing
    tier: repo
    load_bearing: true
    why: >
      The implementation must start with RED tests for registry, intent,
      revalidation, target authorization, durable state, proof vectors,
      distributed limits, route middleware, and the no-bypass source guard.
  - id: commit-style
    tier: repo
    load_bearing: false
    why: >
      RED and GREEN checkpoints use small English Conventional Commits.

