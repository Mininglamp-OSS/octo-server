schema_version: 1
task: cleanup-membership-predicate
brief: .octospec/tasks/cleanup-membership-predicate/brief.md
resolved_at: 2026-08-22T13:35:00+00:00

injected_rules:
  - id: space-isolation
    source: repo
    load_bearing: true
    why: >
      This change edits the predicate that decides whether a removed member gets
      torn out of a Space's groups, so it sits directly on the multi-tenant
      boundary — and it is load-bearing in BOTH directions. A false "still a
      member" leaves a removed person inside the Space's groups and IM
      subscriptions; a false "not a member" tears an active member out of every
      group. The rule's fail-open warning is why CheckMembership itself is left
      byte-for-byte unchanged: it has 37 non-test call sites including
      pkg/space/middleware.go's SpaceMiddleware, the primary auth gate, and
      #797's original proposal to relax it to `status <> 0` would have admitted
      banned Spaces across the entire authenticated API. The new predicate is
      documented as cleanup-only and non-authorizing, and a source guard test
      (TestCheckMembershipStaysStrict) pins the two apart.
  - id: testing
    source: repo
    load_bearing: true
    why: >
      TDD was requested and both behaviour changes are silent ones — a job
      finishing as done/skipped_rejoined looks identical to a job that ran. Each
      new test was mutation-verified: relaxing the predicate to `= 1` kills only
      the banned-Space test, dropping the space join entirely kills only the
      disbanded-orphan test, and relaxing CheckMembership kills only the source
      guard. The two pre-existing gate tests
      (TestCleanupWorkerSkipsRejoinedMember,
      TestGroupCascadeStillRunsAfterSpaceDisbanded) are the no-regression proof.
  - id: error-handling
    source: repo
    load_bearing: true
    why: >
      Injected by path glob (modules/**/*.go) but substantively a no-op here:
      neither gate responds to a client. Both return errors inward — the worker
      releases the job for retry, the step returns an error that the worker
      retries — so no user-facing envelope, no new pkg/errcode entry, and no raw
      c.ResponseError / c.JSON is introduced. i18n-extract-check and i18n-lint
      both pass unchanged.
  - id: rate-limit
    source: repo
    load_bearing: true
    why: >
      Injected by path glob only. No route, middleware, or request-frequency
      counter is touched; the change is entirely inside the background cleanup
      worker and its registered step.
  - id: commit-style
    source: repo
    load_bearing: false
    why: >
      Conventional Commits, English subject line.

gates_run:
  - "go test ./pkg/space/ — pass"
  - "go test ./modules/space/ — pass (full package, 11.3s)"
  - "go test ./modules/group/ — pass (full package, 38.2s)"
  - "golangci-lint run ./pkg/space/... ./modules/space/... ./modules/group/... — 0 issues"
  - "make i18n-extract-check — pass"
  - "make i18n-lint — pass"

notes: >
  Local test services had to be brought up by hand (MySQL, Redis, WuKongIM
  v2.2.4-20260313). Two environment gotchas worth remembering: the `test`
  database must be created with COLLATE utf8mb4_general_ci or migration
  20260308000002 dies with Error 1267 on MySQL 8's utf8mb4_0900_ai_ci default;
  and modules/group tests that create real IM channels fail with a nil-pointer
  panic rather than a clean skip when the broker is down.
