openapi: 3.1.0
info:
  title: OCTO Server CLI API
  version: 2.0.0
  description: |
    OpenAPI contract for the independent /v2/cli surface. The existing /v1
    API remains unchanged and is documented by its existing module contracts.

    This contract describes the implemented independent /v2/cli routes. It
    does not change the existing /v1 API.

    User, Space, message, group, and thread adapters derive Space scope from
    the authenticated Token and apply their resource or membership checks.
    Request fields cannot select or override that bound Space. Routes that
    support a verified User Bot binding use that Bot as the effective actor;
    token-user-only routes continue to act as the Token owner. File routes
    create server-assigned object keys and do not claim Space ownership for
    uploaded objects.
servers:
  - url: https://api.botgate.cn/api
    description: OCTO Server API gateway base; /v2/cli is part of each route.
tags:
  - name: identity
    description: Authenticated token identity.
  - name: user
    description: User profile access.
  - name: space
    description: Access within the token-bound Space.
  - name: message
    description: Messaging, synchronization, and user-principal search.
  - name: group
    description: Native group operations.
  - name: thread
    description: Group thread operations.
  - name: file
    description: File uploads with server-assigned object keys.
  - name: upload
    description: Temporary upload credentials and signed uploads.
security:
  - bearerAuth: []
paths:
  /v2/cli/identity:
    get:
      tags: [identity]
      operationId: identity.get
      summary: Get token identity
      description: |
        Returns the verified token owner, its bound Space, and an optional
        verified User Bot binding. A missing binding is represented by an empty
        bot_id; an invalid or unavailable configured Bot is an error and never falls
        back to the user. This operation does not issue or rotate a legacy Bot
        or IM token.
      x-octo-action: im.identity:read
      x-octo-principal: token_user
      responses:
        '200':
          description: Verified identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/users/{user_id}:
    get:
      tags: [user]
      operationId: user.get
      summary: Get a user profile
      description: Returns a user profile visible to the effective actor within existing user and bound-Space access rules.
      x-octo-action: im.users:read
      x-octo-principal: effective_actor
      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier.
          schema: {type: string}
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/space/members:
    get:
      tags: [space]
      operationId: space.member.list
      summary: List members in the bound Space
      description: |
        Lists members from the authenticated token's bound Space after the
        effective actor passes the existing active-Space-membership check.
        Caller-supplied Space identifiers cannot override that binding.
        Supports a name keyword and page/page_size offset paging with total
        metadata.
      x-octo-action: im.spaces:read
      x-octo-principal: effective_actor
      parameters:
        - name: keyword
          in: query
          required: false
          description: Optional name substring filter; requests over 128 bytes are rejected.
          schema: {type: string}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of Space members and offset pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceMembersResponse'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/typing:
    post:
      tags: [message]
      operationId: message.typing
      summary: Send a typing indicator
      description: Sends typing state as the effective actor after the existing channel access checks. This route does not accept on-behalf-of requests.
      x-octo-action: im.messages:write
      x-octo-principal: effective_actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypingRequest'
      responses:
        '200':
          description: Typing indicator accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageStatusResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/messages:
    post:
      tags: [message]
      operationId: message.send
      summary: Send a message
      description: Sends a message as the effective actor after the existing channel and permission checks. The authenticated user remains the Token owner; this route rejects on-behalf-of requests.
      x-octo-action: im.messages:write
      x-octo-principal: effective_actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSendRequest'
      responses:
        '200':
          description: Message accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSendResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/messages/{message_id}:
    patch:
      tags: [message]
      operationId: message.edit
      summary: Edit a message
      description: |
        Edits a message authored by the effective actor. Token-user edits
        accept content_edit; a bound Bot may also use the existing raw-card or
        registered-template edit mode. The path message_id is copied into the
        request when omitted and must match if supplied.
      x-octo-action: im.messages:write
      x-octo-principal: effective_actor
      parameters:
        - name: message_id
          in: path
          required: true
          description: Message identifier.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageEditRequest'
      responses:
        '200':
          description: Message edited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageStatusResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/messages/_sync:
    post:
      tags: [message]
      operationId: message.sync
      description: Synchronizes channel messages for the effective actor using the supplied sequence range, limit, and pull mode. The response preserves the existing message synchronization shape.
      x-octo-action: im.messages:read
      x-octo-principal: effective_actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSyncRequest'
      responses:
        '200':
          description: Synchronized channel window.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSyncResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/messages/_read_receipt:
    post:
      tags: [message]
      operationId: message.read_receipt
      description: Records message read state for the effective actor after the existing channel and message checks.
      x-octo-action: im.messages:read
      x-octo-principal: effective_actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadReceiptRequest'
      responses:
        '200':
          description: Read state recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageStatusResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/messages/_search:
    post:
      tags: [message]
      operationId: message.search
      summary: Search messages in a channel
      description: Searches as the authenticated token user, never as a bound Bot, and retains channel visibility, Space scope, and message filtering.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageSearchRequest'}
      responses:
        '200':
          description: Cursor-paginated message hits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSearchResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_all:
    post:
      tags: [message]
      operationId: message.search_all
      summary: Search messages and files in a channel
      description: Searches messages and files as the authenticated token user and applies the existing channel, Space, and visibility filters.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageSearchRequest'}
      responses:
        '200':
          description: Cursor-paginated mixed message and file hits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchAllResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_files:
    post:
      tags: [message]
      operationId: message.search_files
      summary: Search files in a channel
      description: Searches file messages as the authenticated token user and retains the current file and visibility filters.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileSearchRequest'}
      responses:
        '200':
          description: Cursor-paginated file hits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileSearchResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_media:
    post:
      tags: [message]
      operationId: message.search_media
      summary: Search media in a channel
      description: Searches image and video messages as the authenticated token user and retains existing channel and visibility rules.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaSearchRequest'}
      responses:
        '200':
          description: Cursor-paginated media hits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaSearchResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_around:
    post:
      tags: [message]
      operationId: message.search_around
      summary: Find context around a message
      description: Finds the visible context window around an anchor as the authenticated token user; the anchor and surrounding hits pass the same channel, Space, and visibility checks.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchAroundRequest'}
      responses:
        '200':
          description: Context window around the anchor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchAroundResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_global_groups:
    post:
      tags: [message]
      operationId: message.search_global_groups
      summary: Search groups across readable channels
      description: |
        Aggregates visible search results by readable channel as the token user.
        Returns a bounded aggregate for the visible groups. pagination.has_more
        indicates that more groups exist than fit in the response; next_cursor
        is always empty because this aggregate does not support paging.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalGroupsSearchRequest'}
      responses:
        '200':
          description: Aggregated visible groups and cursor-shaped legacy metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalGroupsSearchResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_global_messages:
    post:
      tags: [message]
      operationId: message.search_global_messages
      summary: Search messages across readable channels
      description: Searches messages and files across the token user's readable channels, with the existing allowlist, Space, and visibility filters.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalMessagesSearchRequest'}
      responses:
        '200':
          description: Cursor-paginated mixed message and file hits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchAllResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/messages/_search_global_files:
    post:
      tags: [message]
      operationId: message.search_global_files
      summary: Search files across readable channels
      description: Searches file messages across the token user's readable channels and retains existing allowlist, Space, and visibility filters.
      x-octo-action: im.messages:read
      x-octo-principal: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalFilesSearchRequest'}
      responses:
        '200':
          description: Cursor-paginated file hits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileSearchResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/groups:
    get:
      tags: [group]
      operationId: group.list
      summary: List visible groups
      description: Lists non-disbanded native groups in the bound Space where the effective actor has an active membership; purpose-managed groups are excluded. Uses 1-based offset paging.
      x-octo-action: im.groups:read
      x-octo-principal: effective_actor
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of matching native groups.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupListResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [group]
      operationId: group.create
      summary: Create a group
      description: |
        Creates a native group with the token user as creator and the bound
        Space as its Space. A verified User Bot binding may act on the request.
        An optional space_id must match the bound Space.
      x-octo-action: im.groups:write
      x-octo-principal: effective_actor
      x-octo-owner: token_user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupCreateRequest'}
      responses:
        '200':
          description: Created group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupCreateResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/groups/{group_id}:
    get:
      tags: [group]
      operationId: group.get
      summary: Get a group
      description: Returns group details only after the selected actor passes the existing group access checks.
      x-octo-action: im.groups:read
      x-octo-principal: effective_actor
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group identifier.
          schema: {type: string}
      responses:
        '200':
          description: Group data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetailResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/groups/{group_id}/members:
    get:
      tags: [group]
      operationId: group.member.list
      summary: List group members
      description: Lists group members using 1-based page and page_size offset pagination with an optional keyword filter after the effective actor passes the group membership check. Returns the member array and top-level pagination metadata.
      x-octo-action: im.groups:read
      x-octo-principal: effective_actor
      parameters:
        - name: group_id
          in: path
          required: true
          description: Native group identifier.
          schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}
        - name: keyword
          in: query
          required: false
          description: Optional member-name filter.
          schema: {type: string}
        - name: page
          in: query
          required: false
          description: 1-based page number; defaults to 1.
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          description: Page size; defaults to 20 and is limited to 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page of group members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMembersResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/groups/{group_id}/md:
    get:
      tags: [group]
      operationId: group.markdown.get
      summary: Get group Markdown
      description: Gets the group's Markdown document after the effective actor passes the existing group membership check.
      x-octo-action: im.groups:read
      x-octo-principal: effective_actor
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group identifier.
          schema: {type: string}
      responses:
        '200':
          description: Group Markdown document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMarkdownResponse'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [group]
      operationId: group.markdown.update
      summary: Update group Markdown
      description: Updates group Markdown as the effective actor after existing membership, management, and disband checks; the group owner is unchanged.
      x-octo-action: im.groups:write
      x-octo-principal: effective_actor
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group identifier.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarkdownUpdateRequest'}
      responses:
        '200':
          description: Markdown updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarkdownUpdateResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/groups/{group_id}/info:
    patch:
      tags: [group]
      operationId: group.info.update
      summary: Update group information
      description: Updates the supplied group name and/or notice after the existing management and disband checks. The response confirms completion.
      x-octo-action: im.groups:write
      x-octo-principal: effective_actor
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group identifier.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupInfoUpdateRequest'}
      responses:
        '200':
          description: Group information updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
