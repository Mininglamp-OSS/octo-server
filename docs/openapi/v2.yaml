  /v2/cli/files:
    post:
      tags: [file]
      operationId: file.upload
      summary: Upload a file
      description: |
        Uploads one non-empty chat file. The server validates the extension and
        configured size limit, generates a fresh object key, and returns a
        download URL, filename, and byte size; no caller-selected key is allowed.
      x-octo-action: im.files:write
      x-octo-principal: effective_actor
      parameters:
        - name: type
          in: query
          required: false
          description: Only chat uploads are supported; omitting this parameter selects chat.
          schema: {type: string, enum: [chat], default: chat}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/FileUploadForm'}
      responses:
        '200':
          description: Uploaded file information.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUploadResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/files/_download:
    get:
      tags: [file]
      operationId: file.download
      summary: Download a file
      description: |
        Redirects to the existing storage download URL for the supplied object
        key. This legacy-compatible endpoint does not check whether the object
        belongs to the token's Space.
      x-octo-action: im.files:read
      x-octo-principal: effective_actor
      parameters:
        - name: path
          in: query
          required: true
          description: Object key to download.
          schema: {type: string}
        - name: filename
          in: query
          required: false
          description: Optional download filename.
          schema: {type: string}
      responses:
        '302':
          description: Redirect to the storage download URL.
          headers:
            Location:
              description: Storage download URL.
              schema: {type: string, format: uri}
          content:
            text/html:
              schema: {type: string}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v2/cli/uploads/credentials:
    get:
      tags: [upload]
      operationId: upload.credentials.get
      summary: Get temporary upload credentials
      description: Issues temporary credentials using the existing upload policy and storage scope. Returned credentials are sensitive; issuance does not establish file ownership.
      x-octo-action: im.files:write
      x-octo-principal: effective_actor
      parameters:
        - name: filename
          in: query
          required: true
          description: Filename used to validate the extension and construct the object key.
          schema: {type: string}
      responses:
        '200':
          description: Temporary object-storage credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadCredentialsResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
  /v2/cli/uploads/_presigned:
    get:
      tags: [upload]
      operationId: upload.presigned.get
      summary: Get a presigned upload URL
      description: Issues a signed upload URL with the existing file size, extension, storage key, and expiration policy. A signed URL does not establish object ownership.
      x-octo-action: im.files:write
      x-octo-principal: effective_actor
      parameters:
        - name: filename
          in: query
          required: true
          description: Upload filename.
          schema: {type: string}
        - name: file_size
          in: query
          required: true
          description: Expected upload size in bytes.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Presigned upload details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresignedUploadResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OCTO business token
      description: New CLI business Token/API Key; legacy v1 credentials are not accepted by this route group.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based offset page; defaults to 1.
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      required: false
      description: Page size; defaults to 20 and is limited to 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    ValidationError:
      description: Invalid request parameters or body (VALIDATION_ERROR).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationErrorResponse'}
    AuthenticationRequired:
      description: Missing, expired, or invalid new business token (AUTH_REQUIRED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthenticationRequiredErrorResponse'}
    Forbidden:
      description: Token action or resource permission denied (FORBIDDEN).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ForbiddenErrorResponse'}
    NotFound:
      description: Resource not found or intentionally hidden by access checks (NOT_FOUND).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NotFoundErrorResponse'}
    Conflict:
      description: Resource state or version conflict (CONFLICT or DUPLICATE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ConflictErrorResponse'}
    PayloadTooLarge:
      description: Request body or file exceeds a supported size (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PayloadTooLargeErrorResponse'}
    UnsupportedMediaType:
      description: Request content type is not supported (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnsupportedMediaTypeErrorResponse'}
    ClientVersionTooOld:
      description: Client version is below the supported minimum (CLIENT_VERSION_TOO_OLD).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ClientVersionTooOldErrorResponse'}
    RateLimited:
      description: Request rate limit exceeded (RATE_LIMITED).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RateLimitedErrorResponse'}
    InternalError:
      description: Unexpected server failure (INTERNAL_ERROR).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InternalErrorResponse'}
    UpstreamUnavailable:
      description: Search or storage dependency is temporarily unavailable (UPSTREAM_UNAVAILABLE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UpstreamUnavailableErrorResponse'}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: VALIDATION_ERROR}
    AuthenticationRequiredErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: AUTH_REQUIRED}
    ForbiddenErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: FORBIDDEN}
    NotFoundErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: NOT_FOUND}
    ConflictErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, enum: [CONFLICT, DUPLICATE]}
    PayloadTooLargeErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: PAYLOAD_TOO_LARGE}
    UnsupportedMediaTypeErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: UNSUPPORTED_MEDIA_TYPE}
    ClientVersionTooOldErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: CLIENT_VERSION_TOO_OLD}
    RateLimitedErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: RATE_LIMITED}
    InternalErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: INTERNAL_ERROR}
    UpstreamUnavailableErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ApiError'
            - type: object
              required: [code]
              properties:
                code: {type: string, const: UPSTREAM_UNAVAILABLE}
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - DUPLICATE
            - VALIDATION_ERROR
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - CLIENT_VERSION_TOO_OLD
            - RATE_LIMITED
            - INTERNAL_ERROR
            - UPSTREAM_UNAVAILABLE
          description: Fixed OCTO error code. The HTTP status maps to the corresponding code in the response description.
        message:
          type: string
          description: Safe English error message; internal diagnostics are never returned.
        details:
          $ref: '#/components/schemas/ErrorDetails'
        hint:
          type: string
          description: Optional user-facing recovery hint.
    ErrorDetails:
      type: object
      description: Structured, public-safe error details; individual operations may define additional keys.
      properties:
        reason: {type: string}
        field: {type: string}
        resource: {type: string}
        required_role: {type: string}
        conflict_reason: {type: string}
        current_state: {type: string}
        existing_id: {type: string}
        max_bytes: {type: integer, format: int64}
        actual_bytes: {type: integer, format: int64}
        expected: {type: string}
        actual: {type: string}
        min_version: {type: string}
        retry_after_seconds: {type: integer}
        upstream: {type: string}
        upstream_status: {type: integer}
        failed_index: {type: integer}
      additionalProperties: true
    EmptyData:
      type: object
      description: Empty success payload for operations with no business response.
      maxProperties: 0
      additionalProperties: false
    EmptyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EmptyData'
    MessageStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: {type: integer, const: 200}
    OkResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ok]
          properties:
            ok: {type: boolean, const: true}
    CursorPagination:
      type: object
      required: [has_more, next_cursor]
      properties:
        has_more: {type: boolean}
        next_cursor:
          type: string
          description: Opaque cursor. An empty string means there is no resumable next page.
    OffsetPagination:
      type: object
