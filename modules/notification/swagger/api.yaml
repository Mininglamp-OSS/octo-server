openapi: 3.0.3
info:
  title: Octo Notification Pause API
  version: 1.0.0
paths:
  /v1/user/notification-pause:
    get:
      operationId: getNotificationPause
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account notification pause state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPause'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UpdateFailed'
    put:
      operationId: setNotificationPause
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNotificationPause'
      responses:
        '200':
          description: Saved authoritative state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPause'
        '400':
          $ref: '#/components/responses/InvalidTime'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UpdateFailed'
    delete:
      operationId: clearNotificationPause
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restored authoritative state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPause'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UpdateFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SetNotificationPause:
      type: object
      oneOf:
        - required: [duration]
          properties:
            duration:
              type: string
              enum: [30m, 1h]
              description: Fixed duration calculated by the server
        - required: [mode]
          properties:
            mode:
              type: string
              enum: [manual]
              description: Pause until the user explicitly restores notifications
        - required: [paused_until]
          properties:
            paused_until:
              type: string
              format: date-time
              description: UTC absolute time later than server time; mutually exclusive with duration and mode
      description: Exactly one pause intent; unknown extension fields are accepted for forward compatibility
    NotificationPause:
      type: object
      required: [paused, mode, paused_until, revision, server_time]
      properties:
        paused:
          type: boolean
        mode:
          type: string
          enum: [timed, manual]
          nullable: true
        paused_until:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          format: int64
          minimum: 0
        server_time:
          type: string
          format: date-time
      example:
        paused: true
        mode: timed
        paused_until: '2026-08-12T12:30:00.000Z'
        revision: 42
        server_time: '2026-08-12T11:30:00.125Z'
    ErrorDetail:
      type: object
      required: [code, message, details, http_status]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        http_status:
          type: integer
          format: int32
    ErrorEnvelope:
      type: object
      required: [error, msg, status]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        msg:
          type: string
        status:
          type: integer
          format: int32
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidTime:
      description: Invalid or non-future pause time
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: err.server.notification.pause.invalid_time
              message: invalid pause time
              details: {}
              http_status: 400
            msg: invalid pause time
            status: 400
    RateLimited:
      description: Too many requests for this account
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: err.shared.rate.limited
              message: Too many requests
              details: {}
              http_status: 429
            msg: Too many requests
            status: 429
    UpdateFailed:
      description: Database update failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: err.server.notification.pause.update_failed
              message: update failed
              details: {}
              http_status: 500
            msg: update failed
            status: 500
